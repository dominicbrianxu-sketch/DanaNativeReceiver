name: Build Dana Receiver APK V4

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project

          unzip -o DanaNativeReceiver_AUTO_ON_V4.zip -d project

          PROJECT_DIR=$(dirname "$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle tidak ditemukan"
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command line tools
        run: |
          set -e

          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd "$RUNNER_TEMP"

          curl -fsSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

          rm -rf "$ANDROID_HOME/cmdline-tools/latest"

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          unzip -q cmdline-tools.zip \
            -d "$ANDROID_HOME/cmdline-tools/latest"

          mv "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools/"* \
            "$ANDROID_HOME/cmdline-tools/latest/"

          rmdir "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK packages
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Mencari APK hasil build..."

          find project -type f -name "*.apk" -print

          APK=$(find project -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan"
            exit 1
          fi

          echo "APK ditemukan: $APK"

          cp "$APK" "$GITHUB_WORKSPACE/DanaNativeReceiver-AUTO-ON-V4.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DanaNativeReceiver-AUTO-ON-V4
          path: DanaNativeReceiver-AUTO-ON-V4.apk
          if-no-files-found: error
