workflows:
  android-debug:
    name: DanaNativeReceiver APK V4 FIXED2
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Prepare Android project
        script: |
          set -e

          echo "=== PREPARE ANDROID PROJECT ==="

          rm -rf "$CM_BUILD_DIR/v4"
          mkdir -p "$CM_BUILD_DIR/v4"

          echo "Mengekstrak V4 FIXED2..."

          unzip -o \
            "$CM_BUILD_DIR/DanaNativeReceiver_AUTO_ON_V4_FIXED2.zip" \
            -d "$CM_BUILD_DIR/v4"

          echo "=== ISI PROJECT ==="

          find "$CM_BUILD_DIR/v4" \
            -maxdepth 6 \
            -type f \
            | sort

          echo "=== CEK PROJECT ==="

          if [ ! -f "$CM_BUILD_DIR/v4/settings.gradle" ] && \
             [ ! -f "$CM_BUILD_DIR/v4/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle tidak ditemukan"
            exit 1
          fi

          if [ ! -f "$CM_BUILD_DIR/v4/app/build.gradle" ] && \
             [ ! -f "$CM_BUILD_DIR/v4/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan"
            exit 1
          fi

          echo "Project Android ditemukan."

      - name: Configure Android SDK
        script: |
          set -e

          echo "=== CONFIGURE ANDROID SDK ==="

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" \
              > "$CM_BUILD_DIR/v4/local.properties"
          fi

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -n "$SDKMANAGER" ]; then

            echo "sdkmanager ditemukan:"
            echo "$SDKMANAGER"

            yes | "$SDKMANAGER" --licenses \
              >/dev/null 2>&1 || true

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"

          else

            echo "sdkmanager tidak ditemukan."
            echo "Menggunakan Android SDK bawaan Codemagic."

          fi

      - name: Install Gradle 8.9
        script: |
          set -e

          echo "=== INSTALL GRADLE 8.9 ==="

          cd "$CM_BUILD_DIR"

          if [ ! -x "$CM_BUILD_DIR/gradle-8.9/bin/gradle" ]; then

            echo "Download Gradle 8.9..."

            curl -fsSL \
              -o gradle-8.9-bin.zip \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip

            unzip -q -o gradle-8.9-bin.zip

          fi

          "$CM_BUILD_DIR/gradle-8.9/bin/gradle" \
            --version

      - name: Check Java source files
        script: |
          set -e

          echo "=== CEK FILE JAVA ==="

          find "$CM_BUILD_DIR/v4/app/src/main/java" \
            -type f \
            -name "*.java" \
            -print

          echo "=== CEK SERVICE ==="

          test -f "$CM_BUILD_DIR/v4/app/src/main/java/id/varino/danareceiver/NtfyService.java"

          test -f "$CM_BUILD_DIR/v4/app/src/main/java/id/varino/danareceiver/BootReceiver.java"

          test -f "$CM_BUILD_DIR/v4/app/src/main/java/id/varino/danareceiver/DanaAutoClickAccessibilityService.java"

          echo "Semua file service utama ditemukan."

      - name: Build debug APK
        script: |
          set -e

          echo "=== BUILD DANA NATIVE RECEIVER V4 FIXED2 ==="

          cd "$CM_BUILD_DIR/v4"

          "$CM_BUILD_DIR/gradle-8.9/bin/gradle" \
            assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        script: |
          set -e

          echo "=== MENCARI APK ==="

          find "$CM_BUILD_DIR/v4" \
            -type f \
           
