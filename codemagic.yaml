workflows:
  android-debug:
    name: DanaNativeReceiver APK V4
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Prepare Android project
        script: |
          set -e

          echo "=== Prepare project ==="
          rm -rf "$CM_BUILD_DIR/v4"
          mkdir -p "$CM_BUILD_DIR/v4"

          unzip -o "$CM_BUILD_DIR/DanaNativeReceiver_AUTO_ON_V4.zip" -d "$CM_BUILD_DIR/v4"

          echo "=== Project files ==="
          find "$CM_BUILD_DIR/v4" -maxdepth 5 -type f | sort

          test -f "$CM_BUILD_DIR/v4/settings.gradle" || {
            echo "ERROR: settings.gradle tidak ditemukan"
            exit 1
          }

          test -f "$CM_BUILD_DIR/v4/app/build.gradle" || {
            echo "ERROR: app/build.gradle tidak ditemukan"
            exit 1
          }

      - name: Configure Android SDK
        script: |
          set -e

          echo "=== Android SDK ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/v4/local.properties"
          fi

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -n "$SDKMANAGER" ]; then
            echo "sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"
          else
            echo "sdkmanager tidak ditemukan."
            echo "Melanjutkan dengan Android SDK bawaan Codemagic."
          fi

      - name: Install Gradle 8.9
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          if [ ! -x "$CM_BUILD_DIR/gradle-8.9/bin/gradle" ]; then
            echo "=== Download Gradle 8.9 ==="

            curl -fsSL -o gradle-8.9-bin.zip \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip

            unzip -q -o gradle-8.9-bin.zip
          fi

          "$CM_BUILD_DIR/gradle-8.9/bin/gradle" --version

      - name: Build debug APK
        script: |
          set -e

          cd "$CM_BUILD_DIR/v4"

          echo "=== Build DanaNativeReceiver V4 ==="

          "$CM_BUILD_DIR/gradle-8.9/bin/gradle" \
            assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        script: |
          set -e

          echo "=== APK hasil build ==="

          find "$CM_BUILD_DIR/v4" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

          APK="$(find "$CM_BUILD_DIR/v4" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK BERHASIL:"
          echo "$APK"

    artifacts:
      - v4/app/build/outputs/apk/debug/*.apk
