workflows:
  dana-native-receiver-v24-calibrated-envelope-tap:
    name: DanaNativeReceiver V24 - FULL DEBUG TRACE + ADAPTIVE LOADING + CALIBRATED ENVELOPE 10x LEARNING TAP + QR DANA Kaget
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:

      - name: Prepare Android project
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          cd "$ROOT"

          echo "=================================================="
          echo "DANA NATIVE RECEIVER V24"
          echo "PREPARE ANDROID PROJECT"
          echo "=================================================="

          PROJECT_DIR=""

          # Prefer an Android project already checked out at repository root.
          if [ -f "$ROOT/settings.gradle" ] || [ -f "$ROOT/settings.gradle.kts" ]; then

            PROJECT_DIR="$ROOT"

          else

            # If repository contains a project ZIP, prefer V24 only.
            ZIP_FILE=""

            for f in "$ROOT"/*V24*.zip "$ROOT"/*v24*.zip; do
              if [ -f "$f" ]; then
                ZIP_FILE="$f"
                break
              fi
            done

            # Never silently fall back to older V18/V19/V20/V21 projects.
            if [ -z "$ZIP_FILE" ]; then

              echo "ERROR: V24 Android project ZIP tidak ditemukan."
              echo "Pastikan DanaNativeReceiver_V24*.zip ada di repository root."

              exit 1
            fi

            EXTRACT_DIR="$ROOT/.android_project"

            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"

            echo "Extracting: $ZIP_FILE"

            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            SETTINGS_FILE="$(
              find "$EXTRACT_DIR" \
                -type f \
                -name settings.gradle -o -name settings.gradle.kts \
                -print -quit
            )"

            if [ -z "$SETTINGS_FILE" ]; then

              echo "ERROR: settings.gradle tidak ditemukan setelah extract."

              find "$EXTRACT_DIR" \
                -maxdepth 5 \
                -type f \
                -print || true

              exit 1
            fi

            PROJECT_DIR="$(
              cd "$(dirname "$SETTINGS_FILE")" && pwd
            )"

          fi

          test -f "$PROJECT_DIR/settings.gradle" || \
            test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" || \
            test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -d "$PROJECT_DIR/app"

          echo "$PROJECT_DIR" > "$ROOT/.codemagic_project_dir"

          echo "PROJECT_DIR=$PROJECT_DIR"


      - name: Validate V24 10-POINT LEARNING ENVELOPE TAP source
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"

          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "VALIDATING DANA NATIVE RECEIVER V24 FULL DEBUG TRACE"
          echo "=================================================="

          MANIFEST="app/src/main/AndroidManifest.xml"

          ACCESS_XML="app/src/main/res/xml/dana_accessibility_service.xml"

          SERVICE="app/src/main/java/id/varino/danareceiver/DanaAutoClickAccessibilityService.java"

          DEBUG_TRACE="app/src/main/java/id/varino/danareceiver/DebugTrace.java"

          MAIN="app/src/main/java/id/varino/danareceiver/MainActivity.java"

          NTFY="app/src/main/java/id/varino/danareceiver/NtfyService.java"

          BUILD_FILE="app/build.gradle"


          # ==================================================
          # REQUIRED FILES
          # ==================================================

          test -f "$MANIFEST"
          test -f "$ACCESS_XML"
          test -f "$SERVICE"
          test -f "$DEBUG_TRACE"
          test -f "$MAIN"
          test -f "$NTFY"
          test -f "$BUILD_FILE"


          # ==================================================
          # FULL DEBUG TRACE
          # ==================================================

          grep -Fq 'class DebugTrace' "$DEBUG_TRACE"

          grep -Fq 'fullSnapshot' "$DEBUG_TRACE"

          grep -Fq 'dana_debug_trace.log' "$DEBUG_TRACE"

          grep -Fq 'LIHAT DEBUG LENGKAP' "$MAIN"

          grep -Fq 'traceAccessibilityEvent' "$SERVICE"

          grep -Fq 'DebugTrace.detail' "$SERVICE"

          grep -Fq 'DebugTrace.detail' "$NTFY"

          echo "Required files + full-debug instrumentation: OK"


          # ==================================================
          # ACCESSIBILITY SERVICE
          # ==================================================

          grep -Fq \
            'DanaAutoClickAccessibilityService' \
            "$MANIFEST"

          grep -Fq \
            'android.permission.BIND_ACCESSIBILITY_SERVICE' \
            "$MANIFEST"

          grep -Fq \
            'android.accessibilityservice.AccessibilityService' \
            "$MANIFEST"

          grep -Fq \
            'android:canRetrieveWindowContent="true"' \
            "$ACCESS_XML"

          grep -Fq \
            'android:canPerformGestures="true"' \
            "$ACCESS_XML"

          grep -Fq \
            'android:canTakeScreenshot="true"' \
            "$ACCESS_XML"

          echo "AccessibilityService manifest/capabilities: OK"


          # ==================================================
          # GESTURE CALLBACK CONTEXT
          # ==================================================

          grep -Fq \
            'DebugTrace.success(DanaAutoClickAccessibilityService.this, "TAP "' \
            "$SERVICE"

          grep -Fq \
            'DebugTrace.success(DanaAutoClickAccessibilityService.this,' \
            "$SERVICE"

          grep -Fq \
            'DebugTrace.fail(DanaAutoClickAccessibilityService.this, "TAP "' \
            "$SERVICE"

          grep -Fq \
            'DebugTrace.fail(DanaAutoClickAccessibilityService.this, "QR screenshot: HardwareBuffer=null")' \
            "$SERVICE"

          grep -Fq \
            'DebugTrace.fail(DanaAutoClickAccessibilityService.this, "QR screenshot: bitmap conversion gagal")' \
            "$SERVICE"


          # ==================================================
          # CALLBACK BLOCK VALIDATION
          # ==================================================

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/src/main/java/id/varino/danareceiver/"
              "DanaAutoClickAccessibilityService.java"
          )

          src = path.read_text(encoding="utf-8")


          def strip_for_braces(text):

              out = list(text)

              i = 0

              state = "code"

              while i < len(text):

                  c = text[i]

                  n = text[i + 1] if i + 1 < len(text) else ""


                  if state == "line":

                      out[i] = " "

                      if c == "\n":
                          state = "code"


                  elif state == "block":

                      out[i] = " "

                      if c == "*" and n == "/":

                          out[i + 1] = " "

                          i += 1

                          state = "code"


                  elif state == "string":

                      out[i] = " "

                      if c == "\\":

                          if i + 1 < len(text):
                              out[i + 1] = " "

                          i += 1

                      elif c == '"':
                          state = "code"


                  elif state == "char":

                      out[i] = " "

                      if c == "\\":

                          if i + 1 < len(text):
                              out[i + 1] = " "

                          i += 1

                      elif c == "'":
                          state = "code"


                  else:

                      if c == "/" and n == "/":

                          out[i] = out[i + 1] = " "

                          i += 1

                          state = "line"


                      elif c == "/" and n == "*":

                          out[i] = out[i + 1] = " "

                          i += 1

                          state = "block"


                      elif c == '"':

                          out[i] = " "

                          state = "string"


                      elif c == "'":

                          out[i] = " "

                          state = "char"


                  i += 1


              return "".join(out)


          clean = strip_for_braces(src)


          def matching_brace(text, start):

              depth = 0

              for i in range(start, len(text)):

                  if text[i] == "{":

                      depth += 1

                  elif text[i] == "}":

                      depth -= 1

                      if depth == 0:
                          return i

              raise SystemExit("Unclosed callback brace")


          found = 0


          pattern = (
              r"new\s+"
              r"(GestureResultCallback|TakeScreenshotCallback)"
              r"\s*\s*\s*\{"
          )


          for m in re.finditer(pattern, clean):

              found += 1

              start = clean.find("{", m.start())

              end = matching_brace(clean, start)

              block = src[start:end + 1]


              bad = re.findall(
                  r"DebugTrace\.[A-Za-z_]+\(\s*this\s*,",
                  block
              )


              if bad:

                  raise SystemExit(
                      f"ERROR: callback {m.group(1)} contains "
                      "DebugTrace(...this,...). "
                      "Use DanaAutoClickAccessibilityService.this instead."
                  )


          if found == 0:

              raise SystemExit(
                  "ERROR: no GestureResultCallback/"
                  "TakeScreenshotCallback found"
              )


          print(
              f"Callback-context preflight: OK "
              f"({found} callback blocks checked)"
          )

          PY


          echo "Gesture/QR callback Context preflight: OK"


          # ==================================================
          # QR SCANNER
          # ==================================================

          grep -Fq \
            'com.google.mlkit:barcode-scanning' \
            "$BUILD_FILE"

          grep -Fq \
            'Barcode.FORMAT_QR_CODE' \
            "$SERVICE"

          grep -Fq \
            'android.net.Uri' \
            "$SERVICE"

          echo "ML Kit QR scanner: OK"


          # ==================================================
          # ADAPTIVE LOADING / DIRECT TAP
          # ==================================================

          grep -Fq \
            'scheduleDirectEnvelopeTap' \
            "$SERVICE"

          grep -Fq \
            'startDirectTapSequence' \
            "$SERVICE"

          grep -Fq \
            'dispatchNextDirectTap' \
            "$SERVICE"

          grep -Fq \
            'DIRECT_TAP_MAX_ATTEMPTS' \
            "$SERVICE"

          grep -Fq \
            'DIRECT_TAP_START_DELAY_MS' \
            "$SERVICE"

          grep -Fq \
            'DIRECT_TAP_ATTEMPT_GAP_MS' \
            "$SERVICE"

          grep -Fq \
            'DIRECT_TAP_FALLBACK_AFTER_MS' \
            "$SERVICE"

          grep -Fq \
            'danaOpenAt' \
            "$SERVICE"

          grep -Fq \
            'danaLoadingWaitLogged' \
            "$SERVICE"

          grep -Fq \
            'danaFallbackScheduled' \
            "$SERVICE"

          grep -Fq \
            'Guaranteed DANA fallback check fired' \
            "$SERVICE"

          grep -Fq \
            'DANA visit armed from Accessibility event' \
            "$SERVICE"

          grep -Fq \
            'dispatchGesture' \
            "$SERVICE"

          grep -Fq \
            'getRealMetrics' \
            "$SERVICE"


          # ==================================================
          # 10 POINT COORDINATE SYSTEM
          # ==================================================

          grep -Fq \
            'ENVELOPE_TAP_XS' \
            "$SERVICE"

          grep -Fq \
            'ENVELOPE_TAP_YS' \
            "$SERVICE"

          grep -Fq \
            '0.50f, 0.46f, 0.54f, 0.50f, 0.46f' \
            "$SERVICE"

          grep -Fq \
            '0.445f, 0.445f, 0.445f, 0.405f, 0.405f' \
            "$SERVICE"


          # ==================================================
          # NOTIFICATION SHADE
          # ==================================================

          grep -Fq \
            'GLOBAL_ACTION_DISMISS_NOTIFICATION_SHADE' \
            "$SERVICE"


          # ==================================================
          # DANA MAIN / GRIVER
          # ==================================================

          grep -Fq \
            'isDanaMainReadyClass' \
            "$SERVICE"


          # ==================================================
          # PER TAP VERIFICATION
          # ==================================================

          grep -Fq \
            'TAP_VERIFY_DELAY_MS' \
            "$SERVICE"

          grep -Fq \
            'VERIFY: envelopeHintVisible=' \
            "$SERVICE"

          grep -Fq \
            'hint masih ada -> lanjut titik' \
            "$SERVICE"


          echo "10-point calibrated + per-tap UI verification + permanent learning: OK"


          # ==================================================
          # ACTIVE PACKAGE GUARD
          # ==================================================

          grep -Fq \
            'private String getActivePackageSafely()' \
            "$SERVICE"

          echo "Active-package guard helper: OK"


          # ==================================================
          # SCREENSHOT QR PATH
          # ==================================================

          grep -Fq \
            'takeScreenshot' \
            "$SERVICE"

          grep -Fq \
            'TakeScreenshotCallback' \
            "$SERVICE"

          echo "Screenshot QR path: OK"


          # ==================================================
          # DANA / PENDING CLAIM GUARDS
          # ==================================================

          grep -Fq \
            'id.dana' \
            "$SERVICE"

          grep -Fq \
            'hasPendingClaim' \
            "$SERVICE"

          grep -Fq \
            'awaitingClaimResult' \
            "$SERVICE"

          echo "DANA/pending-claim guards: OK"


          # ==================================================
          # JAVA DELIMITER VALIDATION
          # ==================================================

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "app/src/main/java/id/varino/danareceiver/"
              "DanaAutoClickAccessibilityService.java"
          )

          s = p.read_text(encoding="utf-8")


          pairs = {
              "{": "}",
              "(": ")",
              "[": "]"
          }


          closing = set(pairs.values())

          stack = []


          in_string = False
          in_char = False
          in_line_comment = False
          in_block_comment = False

          escape = False

          i = 0


          while i < len(s):

              c = s[i]

              n = s[i + 1] if i + 1 < len(s) else ""


              if in_line_comment:

                  if c == "\n":
                      in_line_comment = False

                  i += 1

                  continue


              if in_block_comment:

                  if c == "*" and n == "/":

                      in_block_comment = False

                      i += 2

                      continue

                  i += 1

                  continue


              if in_string:

                  if escape:

                      escape = False

                  elif c == "\\":

                      escape = True

                  elif c == '"':

                      in_string = False

                  i += 1

                  continue


              if in_char:

                  if escape:

                      escape = False

                  elif c == "\\":

                      escape = True

                  elif c == "'":

                      in_char = False

                  i += 1

                  continue


              if c == "/" and n == "/":

                  in_line_comment = True

                  i += 2

                  continue


              if c == "/" and n == "*":

                  in_block_comment = True

                  i += 2

                  continue


              if c == '"':

                  in_string = True

                  i += 1

                  continue


              if c == "'":

                  in_char = True

                  i += 1

                  continue


              if c in pairs:

                  stack.append(pairs[c])


              elif c in closing:

                  if not stack or stack.pop() != c:

                      raise SystemExit(
                          f"Java delimiter mismatch at character {i}: {c}"
                      )


              i += 1


          if in_string or in_char or in_block_comment:

              raise SystemExit(
                  "Java lexical state left open"
              )


          if stack:

              raise SystemExit(
                  f"Java delimiters left open: {stack[-10:]}"
              )


          print("Java delimiter check: OK")

          PY


          # ==================================================
          # V24 VERSION + LEARNING VALIDATION
          # ==================================================

          echo "=================================================="


          grep -Fq \
            "versionCode 25" \
            "$BUILD_FILE"


          grep -Fq \
            "1.24-10point-learning-envelope-tap" \
            "$BUILD_FILE"


          grep -Fq \
            "DIRECT_TAP_MAX_ATTEMPTS = 10" \
            "$SERVICE"


          grep -Fq \
            "saveLearnedTapPoint" \
            "$SERVICE"


          grep -Fq \
            "buildTapOrder" \
            "$SERVICE"


          grep -Fq \
            "learned_envelope_x" \
            "$SERVICE"


          grep -Fq \
            "learned_envelope_y" \
            "$SERVICE"


          echo "Version metadata: V24 / versionCode 25 OK"


          echo "V24 CALIBRATED ENVELOPE TAP SOURCE VALIDATION OK"


          echo "=================================================="


      - name: Configure Android SDK
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"

          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"

          cd "$PROJECT_DIR"


          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"


          if [ -z "$SDK_ROOT" ]; then

            echo "ERROR: Android SDK tidak ditemukan."

            exit 1

          fi


          echo "sdk.dir=$SDK_ROOT" > local.properties


          SDKMANAGER=""


          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then

            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          else

            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -perm -111 \
                2>/dev/null \
                | head -1 || true
            )"

          fi


          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then

            yes | "$SDKMANAGER" --licenses \
              >/dev/null 2>&1 || true

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-35
