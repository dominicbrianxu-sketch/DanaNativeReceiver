workflows:
  dana-native-receiver-v26:
    name: DanaNativeReceiver V26 - CLAIM SUCCESS STOP + 120s WATCHDOG
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:

      - name: Show Build Environment
        script: |
          set -e

          echo "=============================================="
          echo "DANA NATIVE RECEIVER V26"
          echo "=============================================="

          echo "CI=$CI"
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          ./gradlew --version

      - name: Set Android SDK Location
        script: |
          set -e

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

          echo "local.properties:"
          cat "$CM_BUILD_DIR/local.properties"

      - name: Clean Previous Build
        script: |
          set -e

          ./gradlew clean --no-daemon

      - name: Validate Gradle Project
        script: |
          set -e

          echo "Checking Gradle project..."

          test -f "./gradlew"

          if [ ! -x "./gradlew" ]; then
            chmod +x ./gradlew
          fi

          echo "Gradle wrapper OK"

      - name: Build Debug APK
        script: |
          set -e

          echo "=============================================="
          echo "BUILD DEBUG APK"
          echo "=============================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        script: |
          set -e

          echo "=============================================="
          echo "VERIFY APK"
          echo "=============================================="

          APK_COUNT=$(find . -type f -path "*/build/outputs/apk/**/*.apk" | wc -l | tr -d ' ')

          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          find . -type f -path "*/build/outputs/apk/**/*.apk" -print

      - name: Build Release APK
        script: |
          set -e

          echo "=============================================="
          echo "BUILD RELEASE APK"
          echo "=============================================="

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Collect Build Information
        script: |
          set -e

          mkdir -p "$CM_BUILD_DIR/build-info"

          echo "DanaNativeReceiver V26" \
            > "$CM_BUILD_DIR/build-info/version.txt"

          echo "Build number: $BUILD_NUMBER" \
            >> "$CM_BUILD_DIR/build-info/version.txt"

          echo "Claim detection: Rp..." \
            >> "$CM_BUILD_DIR/build-info/version.txt"

          echo "Claim success stops remaining taps: YES" \
            >> "$CM_BUILD_DIR/build-info/version.txt"

          echo "DANA timeout: 120 seconds" \
            >> "$CM_BUILD_DIR/build-info/version.txt"

          echo "Auto close X after timeout: YES" \
            >> "$CM_BUILD_DIR/build-info/version.txt"

          echo "Standby after close: YES" \
            >> "$CM_BUILD_DIR/build-info/version.txt"

          cat "$CM_BUILD_DIR/build-info/version.txt"

    artifacts:
      - "**/build/outputs/apk/**/*.apk"
      - "build-info/version.txt"

    publishing:
      email:
        recipients:
          - "$CM_BUILD_OWNER_EMAIL"

        notify:
          success: true
          failure: true
