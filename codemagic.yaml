workflows:
  dana-native-receiver-v28-notification-link:
    name: DanaNativeReceiver V28 - NOTIFICATION LINK AUTO-OPEN + TELEGRAM BOT CONTROL
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Prepare V28 Android project
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          cd "$ROOT"

          echo "=================================================="
          echo "DANA NATIVE RECEIVER V28"
          echo "SCREEN OFF FIX + TELEGRAM BOT CONTROL"
          echo "=================================================="

          PROJECT_DIR=""

          if [ -f "$ROOT/settings.gradle" ] || [ -f "$ROOT/settings.gradle.kts" ]; then
            PROJECT_DIR="$ROOT"
            echo "Android project detected at repository root."
          else
            ZIP_FILE=""

            # Prefer the exact V28 source archive. This prevents Codemagic from
            # accidentally selecting an older DanaNativeReceiver*.zip when
            # several archives exist in the workspace.
            PREFERRED_ZIP="$ROOT/DanaNativeReceiver_V28_COMMAND_REPORT_CHAT_FIX.zip"
            if [ -f "$PREFERRED_ZIP" ]; then
              ZIP_FILE="$PREFERRED_ZIP"
            else
              for pattern in \
                "$ROOT"/DanaNativeReceiver_V28*.zip \
                "$ROOT"/DanaNativeReceiver*.zip; do
                if [ -f "$pattern" ]; then
                  ZIP_FILE="$pattern"
                  break
                fi
              done
            fi

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: ZIP project DanaNativeReceiver tidak ditemukan."
              find "$ROOT" -maxdepth 5 -type f \( -iname '*.zip' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print || true
              exit 1
            fi

            EXTRACT_DIR="$ROOT/.android_project"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"

            echo "Extracting project: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            SETTINGS_FILE="$(find "$EXTRACT_DIR" -type f -name 'settings.gradle' -print -quit)"
            if [ -z "$SETTINGS_FILE" ]; then
              SETTINGS_FILE="$(find "$EXTRACT_DIR" -type f -name 'settings.gradle.kts' -print -quit)"
            fi

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle/settings.gradle.kts tidak ditemukan setelah extract."
              find "$EXTRACT_DIR" -maxdepth 8 -type f -print || true
              exit 1
            fi

            PROJECT_DIR="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"
          fi

          test -f "$PROJECT_DIR/settings.gradle" || test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "$PROJECT_DIR" > "$ROOT/.codemagic_project_dir"
          echo "PROJECT_DIR=$PROJECT_DIR"

          # Hard guard against the exact compile error seen in V28: the polling
          # loop calls saveUpdateId(long), so the selected source MUST contain
          # that method before Gradle is allowed to compile anything.
          BOT_CONTROLLER="$PROJECT_DIR/app/src/main/java/id/varino/danareceiver/TelegramBotController.java"
          test -f "$BOT_CONTROLLER"
          grep -Fq 'if (id >= 0) saveUpdateId(id + 1L);' "$BOT_CONTROLLER" || {
            echo "ERROR: TelegramBotController.java is not the expected V28 source (call missing)."
            exit 1
          }
          grep -Fq 'private void saveUpdateId(long nextOffset)' "$BOT_CONTROLLER" || {
            echo "ERROR: TelegramBotController.java is missing saveUpdateId(long)."
            exit 1
          }
          echo "TelegramBotController source guard: OK"

      - name: Cross-check raw V28 logic and Telegram Bot layer
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "CROSS-CHECK RAW V28 + TELEGRAM GROUP BOT"
          echo "=================================================="

          BASE="app/src/main/java/id/varino/danareceiver"
          MANIFEST="app/src/main/AndroidManifest.xml"
          ACCESS_XML="app/src/main/res/xml/dana_accessibility_service.xml"
          BUILD_FILE="app/build.gradle"

          SERVICE="$BASE/DanaAutoClickAccessibilityService.java"
          NTFY="$BASE/NtfyService.java"
          MAIN="$BASE/MainActivity.java"
          DEBUG="$BASE/DebugTrace.java"
          WAKER="$BASE/ScreenWaker.java"
          BOOT="$BASE/BootReceiver.java"
          BOT="$BASE/TelegramBotController.java"
          BOT_SERVICE="$BASE/TelegramBotService.java"

          for f in "$MANIFEST" "$ACCESS_XML" "$BUILD_FILE" "$SERVICE" "$NTFY" "$MAIN" "$DEBUG" "$WAKER" "$BOOT" "$BOT" "$BOT_SERVICE"; do
            test -f "$f"
          done

          echo "Required files: OK"

          # Raw V28 identity/version remains unchanged.
          grep -Fq "namespace 'id.varino.danareceiver'" "$BUILD_FILE"
          grep -Fq "applicationId 'id.varino.danareceiver'" "$BUILD_FILE"
          grep -Fq 'compileSdk 35' "$BUILD_FILE"
          grep -Fq 'targetSdk 35' "$BUILD_FILE"
          grep -Fq 'versionCode 28' "$BUILD_FILE"
          grep -Fq "versionName '1.28-notification-link-autostart'" "$BUILD_FILE"
          echo "Raw V28 build metadata: OK"

          # Screen-off/wake logic.
          grep -Fq 'android.permission.WAKE_LOCK' "$MANIFEST"
          grep -Fq 'android.permission.DISABLE_KEYGUARD' "$MANIFEST"
          grep -Fq 'class ScreenWaker' "$WAKER"
          grep -Fq 'MAX_WAKE_LOCK_MS = 130_000L' "$WAKER"
          grep -Fq 'ScreenWaker.wake' "$NTFY"
          grep -Fq 'ScreenWaker.wake' "$SERVICE"
          grep -Fq 'ScreenWaker.release' "$SERVICE"
          echo "Screen-off/wake logic: OK"

          # Original DANA claim/tap logic.
          grep -Fq 'DIRECT_TAP_START_DELAY_MS = 700L' "$SERVICE"
          grep -Fq 'DEFAULT_DIRECT_TAP_MAX_ATTEMPTS = 10' "$SERVICE"
          grep -Fq 'DEFAULT_DIRECT_TAP_ATTEMPT_GAP_MS = 650L' "$SERVICE"
          grep -Fq 'TAP_VERIFY_DELAY_MS = 350L' "$SERVICE"
          grep -Fq 'DIRECT_TAP_FALLBACK_AFTER_MS = 4000L' "$SERVICE"
          grep -Fq 'ENVELOPE_TAP_XS' "$SERVICE"
          grep -Fq 'ENVELOPE_TAP_YS' "$SERVICE"
          grep -Fq 'saveLearnedTapPoint' "$SERVICE"
          grep -Fq 'buildTapOrder' "$SERVICE"
          grep -Fq 'learned_envelope_x' "$SERVICE"
          grep -Fq 'learned_envelope_y' "$SERVICE"
          grep -Fq 'scheduleDirectEnvelopeTap' "$SERVICE"
          grep -Fq 'startDirectTapSequence' "$SERVICE"
          grep -Fq 'dispatchNextDirectTap' "$SERVICE"
          echo "Original learned 10-point tap logic: OK"

          # V26 stop-on-success and watchdog.
          grep -Fq 'kamu dapet' "$SERVICE"
          grep -Fq 'yay! kamu dapet' "$SERVICE"
          grep -Fq 'claimConfirmed' "$SERVICE"
          grep -Fq 'forceResetAndCloseDana' "$SERVICE"
          grep -Fq 'DANA_AUTO_CLOSE_DELAY_MS' "$SERVICE"
          grep -Fq 'DANA_OPEN_WATCHDOG_MS = 120000L' "$SERVICE"
          grep -Fq 'findCloseButtonRecursive' "$SERVICE"
          grep -Fq 'GLOBAL_ACTION_BACK' "$SERVICE"
          echo "Stop-on-success + auto-close + 2-minute watchdog: OK"

          # QR / screenshot / ML Kit.
          grep -Fq 'com.google.mlkit:barcode-scanning:17.3.0' "$BUILD_FILE"
          grep -Fq 'Barcode.FORMAT_QR_CODE' "$SERVICE"
          grep -Fq 'takeScreenshot' "$SERVICE"
          grep -Fq 'TakeScreenshotCallback' "$SERVICE"
          grep -Fq 'link.dana.id' "$SERVICE"
          grep -Fq 'handleDanaQrUrl' "$SERVICE"
          echo "QR DANA screenshot/ML Kit logic: OK"

          # V28: DANA link directly inside Telegram/Nicegram/Telegram Plus
          # notification must launch DANA without requiring a QR scan or a
          # notification click.
          grep -Fq 'DANA_NOTIFICATION_URL_PATTERN' "$SERVICE"
          grep -Fq 'extractDanaNotificationUrl' "$SERVICE"
          grep -Fq 'handleDanaNotificationUrl' "$SERVICE"
          grep -Fq 'openDanaFromNotification' "$SERVICE"
          grep -Fq 'NOTIFICATION_STATE_CHANGED' "$SERVICE"
          grep -Fq 'Intent.ACTION_VIEW' "$SERVICE"
          grep -Fq 'openDana.setPackage(DANA_PACKAGE)' "$SERVICE"
          echo "Notification DANA URL auto-open path: OK"

          # Accessibility registration.
          grep -Fq 'DanaAutoClickAccessibilityService' "$MANIFEST"
          grep -Fq 'android.permission.BIND_ACCESSIBILITY_SERVICE' "$MANIFEST"
          grep -Fq 'android:canRetrieveWindowContent="true"' "$ACCESS_XML"
          grep -Fq 'android:canPerformGestures="true"' "$ACCESS_XML"
          grep -Fq 'android:canTakeScreenshot="true"' "$ACCESS_XML"
          echo "Accessibility registration/capabilities: OK"

          # Full debug trace remains present.
          grep -Fq 'class DebugTrace' "$DEBUG"
          grep -Fq 'fullSnapshot' "$DEBUG"
          grep -Fq 'dana_debug_trace.log' "$DEBUG"
          grep -Fq 'traceAccessibilityEvent' "$SERVICE"
          echo "Full DebugTrace: OK"

          # New Telegram Bot API layer.
          grep -Fq 'api.telegram.org/bot' "$BOT"
          grep -Fq 'getUpdates' "$BOT"
          grep -Fq 'sendMessage' "$BOT"
          grep -Fq '/status' "$BOT"
          grep -Fq '/on' "$BOT"
          grep -Fq '/off' "$BOT"
          grep -Fq '/settap' "$BOT"
          grep -Fq '/setdelay' "$BOT"
          grep -Fq '/debug' "$BOT"
          grep -Fq 'reply_markup' "$BOT"
          grep -Fq '📊 STATUS' "$BOT"
          grep -Fq 'telegram_bot_token' "$BOT"
          grep -Fq 'telegram_chat_id' "$BOT"
          grep -Fq 'telegram_device_id' "$BOT"
          grep -Fq 'telegram_bot_enabled' "$BOT"
          grep -Fq 'private void saveUpdateId(long nextOffset)' "$BOT"
          grep -Fq 'KEY_UPDATE_ID' "$BOT"
          grep -Fq 'verifyTelegramConnection' "$BOT"
          grep -Fq 'deleteWebhook' "$BOT"
          grep -Fq 'isAllowedChat' "$BOT"
          grep -Fq 'primaryChatId' "$BOT"
          grep -Fq 'TelegramBotService' "$MANIFEST"
          grep -Fq 'TelegramBotController.sendClaimReport' "$SERVICE"
          echo "Telegram Bot API controller: OK"

          # Remote configuration must never exceed original 10-point geometry.
          grep -Fq 'count > 10' "$BOT"
          # The runtime clamp in the source is tightened below by this preflight.
          grep -Fq 'return Math.max(1, Math.min(10, value))' "$SERVICE" || {
            echo "ERROR: runtime tap clamp is not 1-10"
            exit 1
          }
          echo "Remote tap limit 1-10: OK"

          echo "=================================================="
          echo "RAW V28 + TELEGRAM GROUP BOT CROSS-CHECK PASSED"
          echo "=================================================="

      - name: Java syntax preflight
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          pairs = {'{': '}', '(': ')', '[': ']'}
          closing = set(pairs.values())

          for path in Path('app/src/main/java').rglob('*.java'):
              s = path.read_text(encoding='utf-8')
              stack = []
              state = 'code'
              escape = False
              i = 0

              while i < len(s):
                  c = s[i]
                  n = s[i + 1] if i + 1 < len(s) else ''

                  if state == 'line':
                      if c == '\n':
                          state = 'code'
                  elif state == 'block':
                      if c == '*' and n == '/':
                          state = 'code'
                          i += 1
                  elif state == 'string':
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == '"':
                          state = 'code'
                  elif state == 'char':
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == "'":
                          state = 'code'
                  else:
                      if c == '/' and n == '/':
                          state = 'line'
                          i += 1
                      elif c == '/' and n == '*':
                          state = 'block'
                          i += 1
                      elif c == '"':
                          state = 'string'
                      elif c == "'":
                          state = 'char'
                      elif c in pairs:
                          stack.append(pairs[c])
                      elif c in closing:
                          if not stack or stack.pop() != c:
                              raise SystemExit(f'Delimiter mismatch: {path}:{i}:{c}')
                  i += 1

              if state != 'code' or stack:
                  raise SystemExit(f'Unclosed Java syntax: {path} state={state} stack={stack[-10:]}')

              print(f'Java syntax preflight: OK {path}')
          PY

      - name: XML resource preflight
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = [
              Path('app/src/main/AndroidManifest.xml'),
              Path('app/src/main/res/xml/dana_accessibility_service.xml'),
              Path('app/src/main/res/values/strings.xml'),
              Path('app/src/main/res/values/styles.xml'),
          ]

          for p in files:
              ET.parse(p)
              print(f'XML parse: OK {p}')
          PY

      - name: Configure Android SDK 35
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          cd "$PROJECT_DIR"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: ANDROID_SDK_ROOT/ANDROID_HOME tidak tersedia."
            exit 1
          fi

          echo "sdk.dir=$SDK_ROOT" > local.properties

          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 -print -quit 2>/dev/null || true)"
          fi

          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          fi

          test -d "$SDK_ROOT/platforms/android-35" || {
            echo "ERROR: Android platform 35 tidak tersedia."
            exit 1
          }

          echo "Android SDK 35 configuration: OK"

      - name: Prepare Gradle 8.14.1
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          cd "$PROJECT_DIR"

          if [ -x "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD="$PROJECT_DIR/gradlew"
          elif command -v gradle >/dev/null 2>&1; then
            GRADLE_CMD="$(command -v gradle)"
          else
            GRADLE_VERSION="8.14.1"
            DIST_ROOT="$ROOT/.gradle-dist"
            GRADLE_HOME="$DIST_ROOT/gradle-$GRADLE_VERSION"
            GRADLE_ZIP="$DIST_ROOT/gradle-$GRADLE_VERSION-bin.zip"
            mkdir -p "$DIST_ROOT"

            if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
              curl --fail --location --retry 5 --retry-all-errors \
                --connect-timeout 30 --max-time 600 \
                -o "$GRADLE_ZIP" \
                "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
              rm -rf "$GRADLE_HOME"
              unzip -q "$GRADLE_ZIP" -d "$DIST_ROOT"
            fi

            GRADLE_CMD="$GRADLE_HOME/bin/gradle"
          fi

          test -x "$GRADLE_CMD"
          echo "$GRADLE_CMD" > "$ROOT/.codemagic_gradle"
          "$GRADLE_CMD" --version

      - name: Build V28 DEBUG APK
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          GRADLE="$(cat "$ROOT/.codemagic_gradle")"
          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "BUILD DANA NATIVE RECEIVER V28"
          echo "SCREEN OFF FIX + TELEGRAM BOT CONTROL"
          echo "=================================================="

          # Force a clean compile from the selected source archive.
          rm -rf "$PROJECT_DIR/app/build"
          "$GRADLE" --no-daemon --no-build-cache --rerun-tasks --stacktrace --console=plain clean assembleDebug

      - name: Verify APK
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "ERROR: app-debug.apk tidak ditemukan."
            find "$PROJECT_DIR" -type f -name '*.apk' -print || true
            exit 1
          }

          echo "APK found: $APK"
          ls -lh "$APK"

          echo "SHA-256:"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$APK"
          else
            sha256sum "$APK"
          fi

          mkdir -p "$ROOT/out"
          cp "$APK" "$ROOT/out/DanaNativeReceiver-V28-TELEGRAM-CONTROL-DEBUG.apk"
          ls -lh "$ROOT/out/DanaNativeReceiver-V28-TELEGRAM-CONTROL-DEBUG.apk"

    artifacts:
      - $CM_BUILD_DIR/out/DanaNativeReceiver-V28-TELEGRAM-CONTROL-DEBUG.apk
