workflows:
  dana-native-receiver-v11:
    name: DanaNativeReceiver V11 - AUTO TAP + QR DANA Kaget
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Locate and validate Android project
        script: |
          set -euo pipefail

          echo "=== Codemagic workspace ==="
          echo "CM_BUILD_DIR=${CM_BUILD_DIR:-<unset>}"
          pwd
          ls -la

          PROJECT_DIR="${CM_BUILD_DIR:-$PWD}"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            FOUND_SETTINGS="$(find "$PROJECT_DIR" -maxdepth 3 -name settings.gradle -o -name settings.gradle.kts -type f -print -quit 2>/dev/null || true)"
            if [ -n "$FOUND_SETTINGS" ]; then
              PROJECT_DIR="$(cd "$(dirname "$FOUND_SETTINGS")" && pwd)"
            fi
          fi

          cd "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR"

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/xml/dana_accessibility_service.xml
          test -f app/src/main/java/id/varino/danareceiver/DanaAutoClickAccessibilityService.java
          test -f app/src/main/java/id/varino/danareceiver/MainActivity.java
          test -f app/src/main/java/id/varino/danareceiver/NtfyService.java
          test -f app/src/main/java/id/varino/danareceiver/BootReceiver.java

          grep -Fq "com.google.mlkit:barcode-scanning:17.3.0" app/build.gradle
          grep -Fq 'android:canTakeScreenshot="true"' app/src/main/res/xml/dana_accessibility_service.xml
          grep -Fq 'android:canPerformGestures="true"' app/src/main/res/xml/dana_accessibility_service.xml

          echo "=== Project V11 validation OK ==="

      - name: Configure Android SDK
        script: |
          set -euo pipefail

          PROJECT_DIR="${CM_BUILD_DIR:-$PWD}"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            FOUND_SETTINGS="$(find "$PROJECT_DIR" -maxdepth 3 -name settings.gradle -type f -print -quit 2>/dev/null || true)"
            if [ -n "$FOUND_SETTINGS" ]; then
              PROJECT_DIR="$(cd "$(dirname "$FOUND_SETTINGS")" && pwd)"
            fi
          fi

          cd "$PROJECT_DIR"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK path tidak tersedia."
            exit 1
          fi

          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "Android SDK: $SDK_ROOT"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -1 || true)"
          fi

          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"
          else
            echo "sdkmanager tidak ditemukan; menggunakan SDK yang sudah tersedia di Codemagic."
          fi

      - name: Install Gradle 8.9
        script: |
          set -euo pipefail

          PROJECT_DIR="${CM_BUILD_DIR:-$PWD}"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            FOUND_SETTINGS="$(find "$PROJECT_DIR" -maxdepth 3 -name settings.gradle -type f -print -quit 2>/dev/null || true)"

            if [ -n "$FOUND_SETTINGS" ]; then
              PROJECT_DIR="$(cd "$(dirname "$FOUND_SETTINGS")" && pwd)"
            fi
          fi

          cd "$PROJECT_DIR"

          GRADLE_VERSION="8.9"
          GRADLE_HOME_DIR="$PROJECT_DIR/.gradle-dist/gradle-$GRADLE_VERSION"
          GRADLE_ZIP="$PROJECT_DIR/.gradle-dist/gradle-$GRADLE_VERSION-bin.zip"

          mkdir -p "$PROJECT_DIR/.gradle-dist"

          if [ ! -x "$GRADLE_HOME_DIR/bin/gradle" ]; then
            curl \
              --fail \
              --location \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 300 \
              -o "$GRADLE_ZIP" \
              "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"

            rm -rf "$GRADLE_HOME_DIR"

            unzip -q "$GRADLE_ZIP" \
              -d "$PROJECT_DIR/.gradle-dist"
          fi

          "$GRADLE_HOME_DIR/bin/gradle" --version

      - name: Build debug APK
        script: |
          set -euo pipefail

          PROJECT_DIR="${CM_BUILD_DIR:-$PWD}"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            FOUND_SETTINGS="$(find "$PROJECT_DIR" -maxdepth 3 -name settings.gradle -type f -print -quit 2>/dev/null || true)"

            if [ -n "$FOUND_SETTINGS" ]; then
              PROJECT_DIR="$(cd "$(dirname "$FOUND_SETTINGS")" && pwd)"
            fi
          fi

          cd "$PROJECT_DIR"

          GRADLE="$PROJECT_DIR/.gradle-dist/gradle-8.9/bin/gradle"

          test -x "$GRADLE"

          "$GRADLE" clean assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain

      - name: Verify and export APK
        script: |
          set -euo pipefail

          PROJECT_DIR="${CM_BUILD_DIR:-$PWD}"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            FOUND_SETTINGS="$(find "$PROJECT_DIR" -maxdepth 3 -name settings.gradle -type f -print -quit 2>/dev/null || true)"

            if [ -n "$FOUND_SETTINGS" ]; then
              PROJECT_DIR="$(cd "$(dirname "$FOUND_SETTINGS")" && pwd)"
            fi
          fi

          cd "$PROJECT_DIR"

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK tidak ditemukan: $APK_PATH"

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -maxdepth 5 \
              -print 2>/dev/null || true

            exit 1
          fi

          mkdir -p "$CM_EXPORT_DIR"

          cp "$APK_PATH" \
            "$CM_EXPORT_DIR/DanaNativeReceiver-V11-AUTO-TAP-QR.apk"

          ls -lh \
            "$CM_EXPORT_DIR/DanaNativeReceiver-V11-AUTO-TAP-QR.apk"

    artifacts:
      - $CM_EXPORT_DIR/DanaNativeReceiver-V11-AUTO-TAP-QR.apk
