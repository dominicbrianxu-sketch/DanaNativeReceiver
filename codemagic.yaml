workflows:
  dana-native-receiver-v30:
    name: DanaNativeReceiver V30 - FIXED UI + NOTIFICATION AUTO OPEN + QR
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      # ============================================================
      # 1. LOCATE AND PREPARE ANDROID PROJECT
      # ============================================================
      - name: Prepare V30 Android project
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          cd "$ROOT"

          echo "=================================================="
          echo "DANA NATIVE RECEIVER V30"
          echo "PREPARE ANDROID PROJECT"
          echo "=================================================="
          echo "CM_BUILD_DIR=$ROOT"
          echo "PWD=$(pwd)"
          echo ""
          echo "Repository top-level files:"
          find "$ROOT" -maxdepth 2 -type f -print | sort | sed -n '1,200p' || true
          echo ""

          PROJECT_DIR=""

          # Case A: Android project is already at repository root.
          if [ -f "$ROOT/settings.gradle" ] || [ -f "$ROOT/settings.gradle.kts" ]; then
            PROJECT_DIR="$ROOT"
            echo "Android project detected at repository root."
          fi

          # Case B: Android project is inside a nested directory.
          if [ -z "$PROJECT_DIR" ]; then
            SETTINGS_FILE="$(
              find "$ROOT" \
                -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
                -not -path '*/.git/*' \
                -not -path '*/.gradle/*' \
                -not -path '*/.android_project/*' \
                -print | sort | head -n 1 || true
            )"

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"
              echo "Nested Android project detected at: $PROJECT_DIR"
            fi
          fi

          # Case C: repository contains a ZIP with the Android project.
          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE=""

            for pattern in \
              "$ROOT"/DanaNativeReceiver_V30_FIXED_BUILD.zip \
              "$ROOT"/DanaNativeReceiver_V30*.zip \
              "$ROOT"/DanaNativeReceiver*.zip \
              "$ROOT"/*.zip; do
              if [ -f "$pattern" ]; then
                ZIP_FILE="$pattern"
                break
              fi
            done

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project tidak ditemukan."
              echo ""
              echo "Codemagic harus menerima salah satu dari berikut:"
              echo "1. settings.gradle di repository root; atau"
              echo "2. project Android di subfolder; atau"
              echo "3. ZIP DanaNativeReceiver*.zip yang berisi project Android."
              echo ""
              echo "File yang ditemukan:"
              find "$ROOT" -maxdepth 6 -type f \
                \( -name '*.zip' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
                -not -path '*/.git/*' -print | sort || true
              exit 1
            fi

            EXTRACT_DIR="$ROOT/.android_project"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"

            echo "Extracting Android project: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d "$EXTRACT_DIR"

            SETTINGS_FILE="$(find "$EXTRACT_DIR" \
              -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -not -path '*/.git/*' \
              -print | sort | head -n 1 || true)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle/settings.gradle.kts tidak ditemukan setelah ZIP diekstrak."
              find "$EXTRACT_DIR" -maxdepth 8 -type f -print | sort || true
              exit 1
            fi

            PROJECT_DIR="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"
            echo "Extracted PROJECT_DIR=$PROJECT_DIR"
          fi

          # Required Android project files.
          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts tidak ditemukan di $PROJECT_DIR"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle/app/build.gradle.kts tidak ditemukan di $PROJECT_DIR"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml tidak ditemukan di $PROJECT_DIR"
            exit 1
          fi

          echo "$PROJECT_DIR" > "$ROOT/.codemagic_project_dir"

          echo ""
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "Android project structure:"
          find "$PROJECT_DIR" -maxdepth 4 -type f \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print | sort | sed -n '1,220p'

      # ============================================================
      # 2. SOURCE CHECK - NON-BRITTLE
      # ============================================================
      - name: Validate V30 source and required DANA components
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "VALIDATE DANA NATIVE RECEIVER V30"
          echo "=================================================="

          MANIFEST="app/src/main/AndroidManifest.xml"
          BUILD_FILE="app/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="app/build.gradle.kts"
          fi

          SERVICE="$(find app/src/main/java -type f -name 'DanaAutoClickAccessibilityService.java' -print -quit || true)"
          MAIN="$(find app/src/main/java -type f -name 'MainActivity.java' -print -quit || true)"
          NTFY="$(find app/src/main/java -type f -name 'NtfyService.java' -print -quit || true)"
          TELEGRAM="$(find app/src/main/java -type f -name 'TelegramBotController.java' -print -quit || true)"

          test -f "$MANIFEST"
          test -f "$BUILD_FILE"
          test -n "$SERVICE"
          test -n "$MAIN"
          test -n "$NTFY"
          test -n "$TELEGRAM"

          echo "MainActivity=$MAIN"
          echo "AccessibilityService=$SERVICE"
          echo "NtfyService=$NTFY"
          echo "TelegramBotController=$TELEGRAM"

          # Required Android Accessibility registration.
          grep -Fq 'DanaAutoClickAccessibilityService' "$MANIFEST"
          grep -Fq 'android.permission.BIND_ACCESSIBILITY_SERVICE' "$MANIFEST"
          grep -Fq 'android.accessibilityservice.AccessibilityService' "$MANIFEST"

          # Required Accessibility capabilities.
          ACCESS_XML="app/src/main/res/xml/dana_accessibility_service.xml"

          test -f "$ACCESS_XML"

          grep -Fq 'android:canRetrieveWindowContent="true"' "$ACCESS_XML"
          grep -Fq 'android:canPerformGestures="true"' "$ACCESS_XML"
          grep -Fq 'android:canTakeScreenshot="true"' "$ACCESS_XML"

          # Required DANA notification / QR / gesture paths.
          grep -Fq 'link.dana.id' "$SERVICE"
          grep -Fq 'id.dana' "$SERVICE"
          grep -Fq 'Barcode.FORMAT_QR_CODE' "$SERVICE"
          grep -Fq 'takeScreenshot' "$SERVICE"
          grep -Fq 'TakeScreenshotCallback' "$SERVICE"
          grep -Fq 'dispatchGesture' "$SERVICE"

          # Required direct-tap / claim state.
          grep -Fq 'scheduleDirectEnvelopeTap' "$SERVICE"
          grep -Fq 'startDirectTapSequence' "$SERVICE"
          grep -Fq 'dispatchNextDirectTap' "$SERVICE"
          grep -Fq 'DEFAULT_DIRECT_TAP_MAX_ATTEMPTS = 10' "$SERVICE"
          grep -Fq 'hasPendingClaim' "$SERVICE"
          grep -Fq 'awaitingClaimResult' "$SERVICE"

          # Required ML Kit dependency.
          grep -Fq 'com.google.mlkit:barcode-scanning:17.3.0' "$BUILD_FILE"

          # V30 UI guards.
          grep -Fq 'PREVIEW' "$MAIN"
          grep -Fq 'NEXT' "$MAIN"
          grep -Fq 'HorizontalScrollView' "$MAIN"
          grep -Fq 'ScrollView' "$MAIN"
          grep -Fq '1. DANA RECEIVER' "$MAIN"
          grep -Fq '2. TELEGRAM' "$MAIN"
          grep -Fq '3. DEBUG & STATUS' "$MAIN"

          # Telegram fields must remain separate.
          grep -Fq 'telegram_command_chat_id' "$MAIN"
          grep -Fq 'telegram_report_chat_id' "$MAIN"

          echo ""
          echo "Required Android files: OK"
          echo "Accessibility registration: OK"
          echo "DANA notification/QR path: OK"
          echo "Direct TAP path: OK"
          echo "Telegram command/report fields: OK"
          echo "V30 navigation UI: OK"
          echo "V30 source validation PASSED"

      # ============================================================
      # 3. JAVA SYNTAX PREFLIGHT
      # ============================================================
      - name: Java syntax preflight
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          pairs = {'{': '}', '(': ')', '[': ']'}
          closing = set(pairs.values())

          def strip_non_code(text):
              out = list(text)
              state = 'code'
              escape = False
              i = 0

              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''

                  if state == 'line':
                      out[i] = ' '
                      if c == '\n':
                          state = 'code'

                  elif state == 'block':
                      out[i] = ' '
                      if c == '*' and n == '/':
                          out[i + 1] = ' '
                          i += 1
                          state = 'code'

                  elif state == 'string':
                      out[i] = ' '

                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == '"':
                          state = 'code'

                  elif state == 'char':
                      out[i] = ' '

                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == "'":
                          state = 'code'

                  else:
                      if c == '/' and n == '/':
                          out[i] = out[i + 1] = ' '
                          i += 1
                          state = 'line'

                      elif c == '/' and n == '*':
                          out[i] = out[i + 1] = ' '
                          i += 1
                          state = 'block'

                      elif c == '"':
                          out[i] = ' '
                          state = 'string'

                      elif c == "'":
                          out[i] = ' '
                          state = 'char'

                  i += 1

              return ''.join(out), state

          for path in Path('app/src/main/java').rglob('*.java'):
              source = path.read_text(encoding='utf-8')
              clean, state = strip_non_code(source)

              stack = []

              for pos, ch in enumerate(clean):
                  if ch in pairs:
                      stack.append(pairs[ch])

                  elif ch in closing:
                      if not stack or stack.pop() != ch:
                          raise SystemExit(
                              f'Java delimiter mismatch: {path}:{pos}:{ch}'
                          )

              if state != 'code' or stack:
                  raise SystemExit(
                      f'Java syntax structure error: {path} '
                      f'state={state} stack={stack[-10:]}'
                  )

              print('Java syntax structure OK:', path)

          print('Java syntax preflight PASSED')
          PY

      # ============================================================
      # 4. XML PREFLIGHT
      # ============================================================
      - name: XML resource preflight
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for path in Path('app/src/main').rglob('*.xml'):
              ET.parse(path)
              print('XML parse OK:', path)

          print('XML resource preflight PASSED')
          PY

      # ============================================================
      # 5. CONFIGURE ANDROID SDK 35
      # ============================================================
      - name: Configure Android SDK 35
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          cd "$PROJECT_DIR"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: ANDROID_SDK_ROOT/ANDROID_HOME tidak tersedia."
            exit 1
          fi

          echo "sdk.dir=$SDK_ROOT" > local.properties

          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -perm -111 \
                -print \
                -quit \
                2>/dev/null || true
            )"
          fi

          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"
          fi

          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/build-tools/35.0.0"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          echo "Android SDK 35: OK"

      # ============================================================
      # 6. PREPARE GRADLE
      # ============================================================
      - name: Prepare Gradle 8.9
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          cd "$PROJECT_DIR"

          if [ -x "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD="$PROJECT_DIR/gradlew"

          elif command -v gradle >/dev/null 2>&1; then
            GRADLE_CMD="$(command -v gradle)"

          else
            GRADLE_VERSION="8.9"
            DIST="$ROOT/.gradle-dist"
            HOME_DIR="$DIST/gradle-$GRADLE_VERSION"
            ZIP="$DIST/gradle-$GRADLE_VERSION-bin.zip"

            mkdir -p "$DIST"

            if [ ! -x "$HOME_DIR/bin/gradle" ]; then
              rm -f "$ZIP"

              curl \
                --fail \
                --location \
                --retry 5 \
                --retry-all-errors \
                --connect-timeout 30 \
                --max-time 600 \
                -o "$ZIP" \
                "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"

              rm -rf "$HOME_DIR"

              unzip -q "$ZIP" -d "$DIST"
            fi

            GRADLE_CMD="$HOME_DIR/bin/gradle"
          fi

          test -x "$GRADLE_CMD"

          echo "$GRADLE_CMD" > "$ROOT/.codemagic_gradle"

          "$GRADLE_CMD" --version

      # ============================================================
      # 7. GRADLE CLEAN + DEBUG APK
      # ============================================================
      - name: Build V30 Debug APK
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          GRADLE="$(cat "$ROOT/.codemagic_gradle")"

          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "BUILD DANA NATIVE RECEIVER V30"
          echo "=================================================="

          echo "Project: $PROJECT_DIR"
          echo "Gradle: $GRADLE"

          "$GRADLE" \
            --no-daemon \
            --stacktrace \
            --console=plain \
            clean \
            assembleDebug

      # ============================================================
      # 8. VERIFY AND EXPORT APK
      # ============================================================
      - name: Verify and export APK
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          echo "=================================================="
          echo "VERIFY V30 APK"
          echo "=================================================="

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan: $APK"

            echo "APK files found:"
            find "$PROJECT_DIR" \
              -type f \
              -name '*.apk' \
              -print || true

            exit 1
          fi

          mkdir -p "$ROOT/out"

          OUT="$ROOT/out/DanaNativeReceiver-V30-FIXED.apk"

          cp "$APK" "$OUT"

          echo "APK berhasil dibuat:"
          ls -lh "$OUT"

          echo "SHA256:"

          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$OUT"
          else
            sha256sum "$OUT"
          fi

          echo "V30 BUILD PASSED"

    artifacts:
      - $CM_BUILD_DIR/out/DanaNativeReceiver-V30-FIXED.apk
