workflows:
  dana-native-receiver-v9:
    name: DanaNativeReceiver APK V9 AUTO OPEN
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Extract V9 source
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          ZIP_FILE="DanaNativeReceiver_AUTO_OPEN_V9.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE tidak ditemukan"
            echo "=== FILE DI BUILD DIRECTORY ==="
            ls -lah
            exit 1
          fi

          echo "=== EXTRACT V9 SOURCE ==="

          unzip -o "$ZIP_FILE" -d "$CM_BUILD_DIR"

          echo "=== SOURCE EXTRACTED ==="
          ls -lah

      - name: Check project files
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          echo "=== CHECK PROJECT ==="

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/id/varino/danareceiver/MainActivity.java
          test -f app/src/main/java/id/varino/danareceiver/NtfyService.java
          test -f app/src/main/java/id/varino/danareceiver/BootReceiver.java
          test -f app/src/main/java/id/varino/danareceiver/DanaAutoClickAccessibilityService.java

          echo "======================================"
          echo "ALL REQUIRED V9 FILES FOUND"
          echo "======================================"

      - name: Configure Android SDK
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          echo "=== ANDROID SDK ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan:"
            echo "$SDKMANAGER"

            echo "=== SEARCH SDKMANAGER ==="

            find "$ANDROID_SDK_ROOT" \
              -name sdkmanager \
              -type f \
              2>/dev/null || true

            exit 1
          fi

          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          echo "=== SDKMANAGER VERSION ==="
          "$SDKMANAGER" --version

          echo "=== ACCEPT SDK LICENSES ==="

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "=== INSTALL / VERIFY ANDROID PACKAGES ==="

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "=== ANDROID SDK READY ==="

      - name: Install Gradle 8.9
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          echo "=== GRADLE 8.9 ==="

          if [ ! -x "$CM_BUILD_DIR/gradle-8.9/bin/gradle" ]; then

            echo "Downloading Gradle 8.9..."

            curl -fL \
              -o gradle-8.9-bin.zip \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip

            rm -rf gradle-8.9

            unzip -q gradle-8.9-bin.zip

          fi

          echo "=== GRADLE VERSION ==="

          "$CM_BUILD_DIR/gradle-8.9/bin/gradle" --version

      - name: Build V9 APK
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          echo "======================================"
          echo "BUILD V9 APK"
          echo "======================================"

          "$CM_BUILD_DIR/gradle-8.9/bin/gradle" \
            assembleDebug \
            --stacktrace \
            --no-daemon

          echo "======================================"
          echo "GRADLE BUILD FINISHED"
          echo "======================================"

      - name: Verify and export APK
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          APK_PATH=$(find \
            "$CM_BUILD_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK_PATH" ]; then

            echo "ERROR: APK tidak ditemukan."

            echo "=== OUTPUT DIRECTORY ==="

            find \
              "$CM_BUILD_DIR/app/build/outputs" \
              -maxdepth 5 \
              -type f \
              2>/dev/null || true

            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK_PATH"

          echo "=== APK SIZE ==="

          ls -lh "$APK_PATH"

          echo "=== COPY TO CODEMAGIC ARTIFACT DIRECTORY ==="

          mkdir -p "$CM_EXPORT_DIR"

          cp \
            "$APK_PATH" \
            "$CM_EXPORT_DIR/DanaNativeReceiver-V9-AUTO-OPEN.apk"

          echo "======================================"
          echo "ARTIFACT READY"
          echo "======================================"

          ls -lh \
            "$CM_EXPORT_DIR/DanaNativeReceiver-V9-AUTO-OPEN.apk"

    artifacts:
      - $CM_EXPORT_DIR/DanaNativeReceiver-V9-AUTO-OPEN.apk
