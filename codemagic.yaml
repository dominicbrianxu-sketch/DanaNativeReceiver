workflows:
  dana-native-receiver-v13:
    name: DanaNativeReceiver V13 - DIRECT TAP + QR DANA Kaget
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Prepare Android project
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          cd "$ROOT"

          echo "=================================================="
          echo "DANA NATIVE RECEIVER V13"
          echo "PREPARE ANDROID PROJECT"
          echo "=================================================="

          PROJECT_DIR=""

          if [ -f "$ROOT/settings.gradle" ] || [ -f "$ROOT/settings.gradle.kts" ]; then
            PROJECT_DIR="$ROOT"
          else
            ZIP_FILE=""
            for f in "$ROOT"/*.zip; do
              if [ -f "$f" ]; then
                ZIP_FILE="$f"
                break
              fi
            done

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Project Android tidak ditemukan."
              exit 1
            fi

            EXTRACT_DIR="$ROOT/.android_project"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"

            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            SETTINGS_FILE="$(find "$EXTRACT_DIR" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle tidak ditemukan."
              find "$EXTRACT_DIR" -maxdepth 6 -type f -print || true
              exit 1
            fi

            PROJECT_DIR="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"
          fi

          test -f "$PROJECT_DIR/settings.gradle" || test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -d "$PROJECT_DIR/app"

          echo "$PROJECT_DIR" > "$ROOT/.codemagic_project_dir"
          echo "PROJECT_DIR=$PROJECT_DIR"


      - name: Validate V13 source
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "VALIDATING DANA NATIVE RECEIVER V13"
          echo "=================================================="

          MANIFEST="app/src/main/AndroidManifest.xml"
          ACCESS_XML="app/src/main/res/xml/dana_accessibility_service.xml"
          SERVICE_FILE="app/src/main/java/id/varino/danareceiver/DanaAutoClickAccessibilityService.java"

          test -f "$MANIFEST"
          test -f "$ACCESS_XML"
          test -f "$SERVICE_FILE"

          echo "Service: $SERVICE_FILE"

          grep -Fq "DanaAutoClickAccessibilityService" "$MANIFEST"
          grep -Fq "android.permission.BIND_ACCESSIBILITY_SERVICE" "$MANIFEST"
          grep -Fq "android.accessibilityservice.AccessibilityService" "$MANIFEST"

          grep -Fq 'android:canRetrieveWindowContent="true"' "$ACCESS_XML"
          grep -Fq 'android:canPerformGestures="true"' "$ACCESS_XML"
          grep -Fq 'android:canTakeScreenshot="true"' "$ACCESS_XML"

          grep -Rqs "com.google.mlkit:barcode-scanning" app
          grep -Fq "Barcode.FORMAT_QR_CODE" "$SERVICE_FILE"

          # V13 direct-tap path.
          grep -Fq "scheduleDirectEnvelopeTap" "$SERVICE_FILE"
          grep -Fq "performDirectEnvelopeTap" "$SERVICE_FILE"
          grep -Fq "dispatchGesture" "$SERVICE_FILE"
          grep -Fq "getRealMetrics" "$SERVICE_FILE"
          grep -Fq "DIRECT_TAP_MAX_ATTEMPTS" "$SERVICE_FILE"

          # QR screenshot path remains available.
          grep -Fq "takeScreenshot" "$SERVICE_FILE"
          grep -Fq "TakeScreenshotCallback" "$SERVICE_FILE"

          echo "AccessibilityService manifest: OK"
          echo "Gesture capability: OK"
          echo "Screenshot capability: OK"
          echo "ML Kit QR: OK"
          echo "V13 direct tap: OK"
          echo "V13 QR screenshot: OK"

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "app/src/main/java/id/varino/danareceiver/"
              "DanaAutoClickAccessibilityService.java"
          )

          text = p.read_text(encoding="utf-8")

          pairs = {"{": "}", "(": ")", "[": "]"}

          stack = []

          in_string = False
          in_char = False
          in_line_comment = False
          in_block_comment = False
          escape = False

          i = 0

          while i < len(text):
              c = text[i]
              n = text[i + 1] if i + 1 < len(text) else ""

              if in_line_comment:
                  if c == "\n":
                      in_line_comment = False
                  i += 1
                  continue

              if in_block_comment:
                  if c == "*" and n == "/":
                      in_block_comment = False
                      i += 2
                      continue
                  i += 1
                  continue

              if in_string:
                  if escape:
                      escape = False
                  elif c == "\\":
                      escape = True
                  elif c == '"':
                      in_string = False
                  i += 1
                  continue

              if in_char:
                  if escape:
                      escape = False
                  elif c == "\\":
                      escape = True
                  elif c == "'":
                      in_char = False
                  i += 1
                  continue

              if c == "/" and n == "/":
                  in_line_comment = True
                  i += 2
                  continue

              if c == "/" and n == "*":
                  in_block_comment = True
                  i += 2
                  continue

              if c == '"':
                  in_string = True
                  i += 1
                  continue

              if c == "'":
                  in_char = True
                  i += 1
                  continue

              if c in pairs:
                  stack.append(pairs[c])

              elif c in pairs.values():
                  if not stack or stack.pop() != c:
                      raise SystemExit(
                          f"ERROR: Java delimiter mismatch near index {i}: {c}"
                      )

              i += 1

          if stack:
              raise SystemExit(
                  f"ERROR: Java delimiters remain open: {stack[-10:]}"
              )

          print("Java delimiter check: OK")
          PY

          echo "=================================================="
          echo "V13 SOURCE VALIDATION OK"
          echo "=================================================="


      - name: Configure Android SDK
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          cd "$PROJECT_DIR"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK tidak ditemukan."
            exit 1
          fi

          echo "sdk.dir=$SDK_ROOT" > local.properties

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -perm -111 \
                2>/dev/null |
              head -1 || true
            )"
          fi

          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then

            yes | "$SDKMANAGER" \
              --licenses \
              >/dev/null 2>&1 || true

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              || true

          fi

          echo "Android SDK configuration: OK"


      - name: Setup Gradle
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"

          cd "$PROJECT_DIR"

          if [ -x "./gradlew" ]; then

            chmod +x ./gradlew

            echo "$PROJECT_DIR/gradlew" \
              > "$ROOT/.codemagic_gradle"

          elif command -v gradle >/dev/null 2>&1; then

            echo "$(command -v gradle)" \
              > "$ROOT/.codemagic_gradle"

          else

            VERSION="8.9"

            DIST_ROOT="$ROOT/.gradle-dist"
            GRADLE_HOME="$DIST_ROOT/gradle-$VERSION"
            GRADLE_ZIP="$DIST_ROOT/gradle-$VERSION-bin.zip"

            mkdir -p "$DIST_ROOT"

            if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then

              curl \
                --fail \
                --location \
                --retry 5 \
                --retry-all-errors \
                --connect-timeout 30 \
                --max-time 600 \
                -o "$GRADLE_ZIP" \
                "https://services.gradle.org/distributions/gradle-$VERSION-bin.zip"

              rm -rf "$GRADLE_HOME"

              unzip -q \
                "$GRADLE_ZIP" \
                -d "$DIST_ROOT"

            fi

            echo "$GRADLE_HOME/bin/gradle" \
              > "$ROOT/.codemagic_gradle"

          fi

          GRADLE="$(cat "$ROOT/.codemagic_gradle")"

          chmod +x "$GRADLE" 2>/dev/null || true

          "$GRADLE" --version


      - name: Build V13 APK
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          GRADLE="$(cat "$ROOT/.codemagic_gradle")"

          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "BUILD DANA NATIVE RECEIVER V13"
          echo "=================================================="

          "$GRADLE" \
            clean \
            assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain

          echo "=================================================="
          echo "V13 BUILD FINISHED"
          echo "=================================================="


      - name: Verify and export V13 APK
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          OUTPUT="$CM_EXPORT_DIR/DanaNativeReceiver-V13-DIRECT-TAP-QR.apk"

          if [ ! -f "$APK" ]; then

            echo "ERROR: APK tidak ditemukan."

            echo "Mencari APK yang tersedia:"

            find "$PROJECT_DIR" \
              -type f \
              -name '*.apk' \
              -print || true

            exit 1
          fi

          mkdir -p "$CM_EXPORT_DIR"

          cp "$APK" "$OUTPUT"

          echo "APK OUTPUT:"
          echo "$OUTPUT"

          ls -lh "$OUTPUT"

          echo ""
          echo "SHA-256:"

          if command -v shasum >/dev/null 2>&1; then

            shasum -a 256 "$OUTPUT"

          elif command -v sha256sum >/dev/null 2>&1; then

            sha256sum "$OUTPUT"

          fi

          echo ""
          echo "=================================================="
          echo "DANA NATIVE RECEIVER V13 BUILD SUCCESS"
          echo "=================================================="


    artifacts:
      - $CM_EXPORT_DIR/DanaNativeReceiver-V13-DIRECT-TAP-QR.apk
