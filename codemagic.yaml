workflows:
  dana-native-receiver-v30:
    name: DanaNativeReceiver V30 - 3 PAGE HORIZONTAL UI
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:

      - name: Verify V30 Android project and 3-page UI
        script: |
          set -u
          cd "$CM_BUILD_DIR"

          echo "=========================================="
          echo "DANA NATIVE RECEIVER V30"
          echo "ANDROID PROJECT VERIFICATION"
          echo "=========================================="

          echo ""
          echo "Build directory:"
          echo "$CM_BUILD_DIR"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort | sed -n '1,200p'

          echo ""
          echo "=========================================="
          echo "CHECK ANDROID PROJECT"
          echo "=========================================="

          test -f settings.gradle || \
          test -f settings.gradle.kts || {
            echo ""
            echo "ERROR: settings.gradle / settings.gradle.kts tidak ditemukan."
            exit 1
          }

          test -f app/build.gradle || \
          test -f app/build.gradle.kts || {
            echo ""
            echo "ERROR: app/build.gradle / app/build.gradle.kts tidak ditemukan."
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo ""
            echo "ERROR: AndroidManifest.xml tidak ditemukan."
            exit 1
          }

          test -f app/src/main/java/id/varino/danareceiver/MainActivity.java || {
            echo ""
            echo "ERROR: MainActivity.java tidak ditemukan."
            exit 1
          }

          test -f app/src/main/java/id/varino/danareceiver/DanaAutoClickAccessibilityService.java || {
            echo ""
            echo "ERROR: DanaAutoClickAccessibilityService.java tidak ditemukan."
            exit 1
          }

          test -f app/src/main/java/id/varino/danareceiver/NtfyService.java || {
            echo ""
            echo "ERROR: NtfyService.java tidak ditemukan."
            exit 1
          }

          test -f app/src/main/java/id/varino/danareceiver/TelegramBotController.java || {
            echo ""
            echo "ERROR: TelegramBotController.java tidak ditemukan."
            exit 1
          }

          echo ""
          echo "Android project files: OK"

          echo ""
          echo "=========================================="
          echo "CHECK V30 UI MARKERS"
          echo "=========================================="

          grep -nE \
            'DANA Native Receiver|HorizontalScrollView|SEBELUMNYA|BERIKUTNYA|TELEGRAM' \
            app/src/main/java/id/varino/danareceiver/MainActivity.java || true

          echo ""
          echo "V30 source verification: OK"


      - name: Java syntax preflight
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          echo "=========================================="
          echo "JAVA SYNTAX PREFLIGHT"
          echo "=========================================="

          python3 - <<'PY'
          from pathlib import Path

          pairs = {
              '{': '}',
              '(': ')',
              '[': ']'
          }

          closing = set(pairs.values())

          java_root = Path(
              'app/src/main/java'
          )

          if not java_root.exists():
              raise SystemExit(
                  'ERROR: app/src/main/java tidak ditemukan'
              )

          java_files = list(
              java_root.rglob('*.java')
          )

          if not java_files:
              raise SystemExit(
                  'ERROR: Tidak ada file Java ditemukan'
              )

          print(
              f'Found {len(java_files)} Java files'
          )

          for path in java_files:

              print(
                  f'Checking Java syntax: {path}'
              )

              s = path.read_text(
                  encoding='utf-8'
              )

              stack = []

              state = 'code'

              escaped = False

              i = 0

              while i < len(s):

                  c = s[i]

                  n = (
                      s[i + 1]
                      if i + 1 < len(s)
                      else ''
                  )

                  if state == 'line_comment':

                      if c == '\n':
                          state = 'code'

                  elif state == 'block_comment':

                      if c == '*' and n == '/':
                          state = 'code'
                          i += 1

                  elif state == 'string':

                      if escaped:
                          escaped = False

                      elif c == '\\':
                          escaped = True

                      elif c == '"':
                          state = 'code'

                  elif state == 'char':

                      if escaped:
                          escaped = False

                      elif c == '\\':
                          escaped = True

                      elif c == "'":
                          state = 'code'

                  else:

                      if c == '/' and n == '/':

                          state = 'line_comment'

                          i += 1

                      elif c == '/' and n == '*':

                          state = 'block_comment'

                          i += 1

                      elif c == '"':

                          state = 'string'

                      elif c == "'":

                          state = 'char'

                      elif c in pairs:

                          stack.append(
                              pairs[c]
                          )

                      elif c in closing:

                          if (
                              not stack
                              or stack.pop() != c
                          ):

                              raise SystemExit(
                                  f'Delimiter mismatch: '
                                  f'{path}:{i}:{c}'
                              )

                  i += 1

              if state != 'code':

                  raise SystemExit(
                      f'Unclosed Java lexical state: '
                      f'{path} '
                      f'state={state}'
                  )

              if stack:

                  raise SystemExit(
                      f'Unclosed Java delimiter: '
                      f'{path} '
                      f'stack={stack[-10:]}'
                  )

              print(
                  f'Java syntax preflight OK: {path}'
              )

          print(
              '=========================================='
          )

          print(
              'ALL JAVA FILES PASSED PREFLIGHT'
          )

          print(
              '=========================================='
          )

          PY


