workflows:
  dana-native-receiver-v12:
    name: DanaNativeReceiver V12 - VISUAL AUTO TAP + QR DANA Kaget
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:

      # ============================================================
      # 1. PREPARE ANDROID PROJECT
      # ============================================================
      - name: Prepare Android project
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          cd "$ROOT"

          echo "=================================================="
          echo "DANA NATIVE RECEIVER V12"
          echo "PREPARE ANDROID PROJECT"
          echo "=================================================="

          echo "Repository:"
          ls -lah

          # --------------------------------------------------------
          # Jika project Android langsung berada di repository
          # --------------------------------------------------------
          if [ -f "$ROOT/settings.gradle" ] || [ -f "$ROOT/settings.gradle.kts" ]; then

            PROJECT_DIR="$ROOT"

          else

            # ------------------------------------------------------
            # Cari ZIP project Android
            # ------------------------------------------------------
            ZIP_FILE=""

            for f in "$ROOT"/*.zip; do
              if [ -f "$f" ]; then
                ZIP_FILE="$f"
                break
              fi
            done

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: ZIP project Android tidak ditemukan."
              echo "Pastikan file ZIP project di-upload ke repository."
              exit 1
            fi

            EXTRACT_DIR="$ROOT/.android_project"

            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"

            echo "Project ZIP:"
            echo "$ZIP_FILE"

            echo "Extracting project..."
            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            # ------------------------------------------------------
            # Cari settings.gradle
            # ------------------------------------------------------
            SETTINGS_FILE="$(
              find "$EXTRACT_DIR" \
                -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \) \
                -print -quit
            )"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle tidak ditemukan."
              echo "Isi hasil extract:"
              find "$EXTRACT_DIR" -maxdepth 6 -print || true
              exit 1
            fi

            PROJECT_DIR="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"

          fi

          echo ""
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo ""

          # --------------------------------------------------------
          # Validasi struktur Android
          # --------------------------------------------------------
          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: folder app tidak ditemukan."
            exit 1
          fi

          echo "$PROJECT_DIR" > "$ROOT/.codemagic_project_dir"

          echo "=================================================="
          echo "ANDROID PROJECT FOUND"
          echo "=================================================="

          find "$PROJECT_DIR" -maxdepth 2 -type f | sort | head -100


      # ============================================================
      # 2. VALIDATE V12 SOURCE
      # ============================================================
      - name: Validate V12 source
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"

          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "VALIDATING DANA NATIVE RECEIVER V12"
          echo "=================================================="

          # --------------------------------------------------------
          # File wajib
          # --------------------------------------------------------
          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/res/xml/dana_accessibility_service.xml

          # --------------------------------------------------------
          # Cari AccessibilityService
          # --------------------------------------------------------
          SERVICE_FILE="$(
            find app/src/main \
              -type f \
              \( -name '*.java' -o -name '*.kt' \) \
              -print |
            xargs grep -l 'AccessibilityService' 2>/dev/null |
            head -1 || true
          )"

          if [ -z "$SERVICE_FILE" ]; then
            echo "ERROR: AccessibilityService tidak ditemukan."
            exit 1
          fi

          echo "AccessibilityService:"
          echo "$SERVICE_FILE"

          # --------------------------------------------------------
          # ML Kit Barcode
          # --------------------------------------------------------
          if ! grep -Rqs \
            'com.google.mlkit:barcode-scanning' \
            app; then

            echo "ERROR: ML Kit Barcode Scanner tidak ditemukan."
            exit 1
          fi

          echo "ML Kit Barcode Scanner: OK"

          # --------------------------------------------------------
          # Gesture permission
          # --------------------------------------------------------
          if ! grep -Rqs \
            'canPerformGestures' \
            app/src/main/res/xml; then

            echo "ERROR: canPerformGestures tidak ditemukan."
            exit 1
          fi

          echo "canPerformGestures: OK"

          # --------------------------------------------------------
          # Screenshot permission
          # --------------------------------------------------------
          if ! grep -Rqs \
            'canTakeScreenshot' \
            app/src/main/res/xml; then

            echo "ERROR: canTakeScreenshot tidak ditemukan."
            exit 1
          fi

          echo "canTakeScreenshot: OK"

          # --------------------------------------------------------
          # Android URI
          # --------------------------------------------------------
          if ! grep -Rqs \
            'import android.net.Uri;' \
            "$SERVICE_FILE"; then

            echo "WARNING: android.net.Uri tidak ditemukan."
          else
            echo "android.net.Uri: OK"
          fi

          # --------------------------------------------------------
          # V12 visual logic
          # --------------------------------------------------------
          if ! grep -Rqs \
            'takeScreenshot' \
            "$SERVICE_FILE"; then

            echo "ERROR: takeScreenshot() V12 tidak ditemukan."
            exit 1
          fi

          if ! grep -Rqs \
            'dispatchGesture' \
            "$SERVICE_FILE"; then

            echo "ERROR: dispatchGesture() tidak ditemukan."
            exit 1
          fi

          if ! grep -Rqs \
            'looksLikeDanaKagetEnvelope' \
            "$SERVICE_FILE"; then

            echo "ERROR: visual envelope detector V12 tidak ditemukan."
            exit 1
          fi

          if ! grep -Rqs \
            'tapDanaEnvelopeByScreenCoordinate' \
            "$SERVICE_FILE"; then

            echo "ERROR: visual tap method V12 tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "V12 SOURCE VALIDATION OK"
          echo "=================================================="


      # ============================================================
      # 3. CONFIGURE ANDROID SDK
      # ============================================================
      - name: Configure Android SDK
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"

          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "CONFIGURING ANDROID SDK"
          echo "=================================================="

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK tidak ditemukan."
            exit 1
          fi

          echo "ANDROID SDK:"
          echo "$SDK_ROOT"

          # --------------------------------------------------------
          # local.properties
          # --------------------------------------------------------
          echo "sdk.dir=$SDK_ROOT" > local.properties

          # --------------------------------------------------------
          # Cari sdkmanager
          # --------------------------------------------------------
          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then

            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          else

            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -perm -111 \
                2>/dev/null |
              head -1 || true
            )"

          fi

          # --------------------------------------------------------
          # Install SDK components jika sdkmanager tersedia
          # --------------------------------------------------------
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then

            echo "sdkmanager:"
            echo "$SDKMANAGER"

            yes | "$SDKMANAGER" \
              --licenses \
              >/dev/null 2>&1 || true

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              || true

          else

            echo "WARNING: sdkmanager tidak ditemukan."
            echo "Melanjutkan menggunakan SDK Codemagic."

          fi

          echo ""
          echo "Android SDK configuration selesai."


      # ============================================================
      # 4. SETUP GRADLE
      # ============================================================
      - name: Setup Gradle
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"

          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "SETTING UP GRADLE"
          echo "=================================================="

          # --------------------------------------------------------
          # Gunakan Gradle Wrapper jika tersedia
          # --------------------------------------------------------
          if [ -x "./gradlew" ]; then

            echo "Gradle Wrapper ditemukan."

            chmod +x ./gradlew

            echo "$PROJECT_DIR/gradlew" > "$ROOT/.codemagic_gradle"

          else

            echo "Gradle Wrapper tidak ditemukan."
            echo "Menggunakan Gradle 8.9."

            VERSION="8.9"

            GRADLE_ROOT="$ROOT/.gradle-dist"
            GRADLE_DIR="$GRADLE_ROOT/gradle-$VERSION"
            GRADLE_ZIP="$GRADLE_ROOT/gradle-$VERSION-bin.zip"

            mkdir -p "$GRADLE_ROOT"

            if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then

              echo "Downloading Gradle $VERSION..."

              curl \
                --fail \
                --location \
                --retry 5 \
                --retry-all-errors \
                --connect-timeout 30 \
                --max-time 600 \
                -o "$GRADLE_ZIP" \
                "https://services.gradle.org/distributions/gradle-$VERSION-bin.zip"

              rm -rf "$GRADLE_DIR"

              unzip -q \
                "$GRADLE_ZIP" \
                -d "$GRADLE_ROOT"

            fi

            echo "$GRADLE_DIR/bin/gradle" > "$ROOT/.codemagic_gradle"

          fi

          GRADLE="$(cat "$ROOT/.codemagic_gradle")"

          echo ""
          echo "Gradle executable:"
          echo "$GRADLE"

          echo ""
          "$GRADLE" --version


      # ============================================================
      # 5. BUILD V12 APK
      # ============================================================
      - name: Build V12 APK
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          GRADLE="$(cat "$ROOT/.codemagic_gradle")"

          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "DANA NATIVE RECEIVER V12 BUILD"
          echo "=================================================="

          echo "Project:"
          pwd

          echo ""
          echo "Gradle:"
          "$GRADLE" --version

          echo ""
          echo "Starting build..."

          "$GRADLE" \
            clean \
            assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain

          echo ""
          echo "=================================================="
          echo "GRADLE BUILD FINISHED"
          echo "=================================================="


      # ============================================================
      # 6. VERIFY APK
      # ============================================================
      - name: Verify V12 APK
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          echo "=================================================="
          echo "VERIFYING APK"
          echo "=================================================="

          if [ ! -f "$APK" ]; then

            echo "ERROR: APK tidak ditemukan."

            echo ""
            echo "Mencari semua APK:"
            find "$PROJECT_DIR" \
              -type f \
              -name '*.apk' \
              -print || true

            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          echo ""
          ls -lh "$APK"

          # --------------------------------------------------------
          # Export directory
          # --------------------------------------------------------
          mkdir -p "$CM_EXPORT_DIR"

          OUTPUT_APK="$CM_EXPORT_DIR/DanaNativeReceiver-V12-VISUAL-AUTO-TAP-QR.apk"

          cp "$APK" "$OUTPUT_APK"

          echo ""
          echo "=================================================="
          echo "APK OUTPUT"
          echo "=================================================="

          ls -lh "$OUTPUT_APK"

          # --------------------------------------------------------
          # SHA256
          # --------------------------------------------------------
          echo ""
          echo "SHA256:"

          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$OUTPUT_APK"
          elif command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$OUTPUT_APK"
          else
            echo "SHA256 tool tidak tersedia."
          fi

          echo ""
          echo "=================================================="
          echo "DANA NATIVE RECEIVER V12 BUILD SUCCESS"
          echo "=================================================="


    # ==============================================================
    # ARTIFACT
    # ==============================================================
    artifacts:
      - $CM_EXPORT_DIR/DanaNativeReceiver-V12-VISUAL-AUTO-TAP-QR.apk
