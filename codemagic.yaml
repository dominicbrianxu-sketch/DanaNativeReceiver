workflows:
  dana-native-receiver-v17-debug-trace:
    name: DanaNativeReceiver V17 - DEBUG PROCESS TRACE + ADAPTIVE LOADING + FIXED CENTER 4x TAP + QR DANA Kaget
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Prepare Android project
        script: |
          set -e
          ROOT="$CM_BUILD_DIR"
          cd "$ROOT"

          echo "=================================================="
          echo "DANA NATIVE RECEIVER V17"
          echo "PREPARE ANDROID PROJECT"
          echo "=================================================="

          PROJECT_DIR=""

          # Prefer Android project already checked out at repository root.
          if [ -f "$ROOT/settings.gradle" ] || [ -f "$ROOT/settings.gradle.kts" ]; then
            PROJECT_DIR="$ROOT"
          else
            ZIP_FILE=""

            # Prefer V17/V16 project ZIP.
            for f in "$ROOT"/*V17*.zip "$ROOT"/*v17*.zip \
                     "$ROOT"/*V16*.zip "$ROOT"/*v16*.zip; do
              if [ -f "$f" ]; then
                ZIP_FILE="$f"
                break
              fi
            done

            # Fallback to first ZIP.
            if [ -z "$ZIP_FILE" ]; then
              for f in "$ROOT"/*.zip; do
                if [ -f "$f" ]; then
                  ZIP_FILE="$f"
                  break
                fi
              done
            fi

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project tidak ditemukan."
              exit 1
            fi

            EXTRACT_DIR="$ROOT/.android_project"

            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"

            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            SETTINGS_FILE="$(find "$EXTRACT_DIR" \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle tidak ditemukan setelah extract."
              find "$EXTRACT_DIR" -maxdepth 6 -type f -print || true
              exit 1
            fi

            PROJECT_DIR="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"
          fi

          test -f "$PROJECT_DIR/settings.gradle" \
            || test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" \
            || test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -d "$PROJECT_DIR/app"

          echo "$PROJECT_DIR" > "$ROOT/.codemagic_project_dir"

          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Validate V17 DEBUG TRACE source
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"

          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "VALIDATING DANA NATIVE RECEIVER V17"
          echo "DEBUG PROCESS TRACE"
          echo "=================================================="

          MANIFEST="app/src/main/AndroidManifest.xml"
          ACCESS_XML="app/src/main/res/xml/dana_accessibility_service.xml"
          SERVICE="app/src/main/java/id/varino/danareceiver/DanaAutoClickAccessibilityService.java"
          DEBUG_TRACE="app/src/main/java/id/varino/danareceiver/DebugTrace.java"
          BUILD_FILE="app/build.gradle"

          # Required files
          test -f "$MANIFEST"
          test -f "$ACCESS_XML"
          test -f "$SERVICE"
          test -f "$DEBUG_TRACE"
          test -f "$BUILD_FILE"

          echo "Required files: OK"

          # Accessibility service
          grep -Fq 'DanaAutoClickAccessibilityService' "$MANIFEST"

          grep -Fq \
            'android.permission.BIND_ACCESSIBILITY_SERVICE' \
            "$MANIFEST"

          grep -Fq \
            'android.accessibilityservice.AccessibilityService' \
            "$MANIFEST"

          grep -Fq \
            'android:canRetrieveWindowContent="true"' \
            "$ACCESS_XML"

          grep -Fq \
            'android:canPerformGestures="true"' \
            "$ACCESS_XML"

          grep -Fq \
            'android:canTakeScreenshot="true"' \
            "$ACCESS_XML"

          echo "AccessibilityService manifest/capabilities: OK"

          # DebugTrace class
          grep -Fq 'class DebugTrace' "$DEBUG_TRACE"

          grep -Fq 'success(' "$DEBUG_TRACE"

          grep -Fq 'fail(' "$DEBUG_TRACE"

          echo "DebugTrace helper: OK"

          # IMPORTANT:
          # Inside GestureResultCallback, `this` refers to callback object.
          # Therefore AccessibilityService.this must be used.

          grep -Fq \
            'DebugTrace.success(DanaAutoClickAccessibilityService.this, "TAP "' \
            "$SERVICE"

          grep -Fq \
            'DebugTrace.success(DanaAutoClickAccessibilityService.this, "Hint amplop hilang setelah TAP "' \
            "$SERVICE"

          grep -Fq \
            'DebugTrace.fail(DanaAutoClickAccessibilityService.this, "TAP "' \
            "$SERVICE"

          echo "Gesture callback DebugTrace context fix: OK"

          # QR scanner
          grep -Fq \
            'com.google.mlkit:barcode-scanning' \
            "$BUILD_FILE"

          grep -Fq \
            'Barcode.FORMAT_QR_CODE' \
            "$SERVICE"

          grep -Fq \
            'android.net.Uri' \
            "$SERVICE"

          echo "ML Kit QR scanner: OK"

          # Adaptive loading/direct tap
          grep -Fq \
            'scheduleDirectEnvelopeTap' \
            "$SERVICE"

          grep -Fq \
            'startDirectTapSequence' \
            "$SERVICE"

          grep -Fq \
            'dispatchNextDirectTap' \
            "$SERVICE"

          grep -Fq \
            'DIRECT_TAP_MAX_ATTEMPTS' \
            "$SERVICE"

          grep -Fq \
            'DIRECT_TAP_START_DELAY_MS' \
            "$SERVICE"

          grep -Fq \
            'DIRECT_TAP_ATTEMPT_GAP_MS' \
            "$SERVICE"

          grep -Fq \
            'DIRECT_TAP_FALLBACK_AFTER_MS' \
            "$SERVICE"

          grep -Fq \
            'danaOpenAt' \
            "$SERVICE"

          grep -Fq \
            'danaLoadingWaitLogged' \
            "$SERVICE"

          grep -Fq \
            'dispatchGesture' \
            "$SERVICE"

          grep -Fq \
            'getRealMetrics' \
            "$SERVICE"

          grep -Fq \
            'ENVELOPE_TAP_X = 0.50f' \
            "$SERVICE"

          grep -Fq \
            'ENVELOPE_TAP_Y = 0.43f' \
            "$SERVICE"

          echo "Adaptive loading + fixed-center 4x direct tap: OK"

          # Active package helper
          grep -Fq \
            'private String getActivePackageSafely()' \
            "$SERVICE"

          echo "Active-package guard helper: OK"

          # Screenshot
          grep -Fq \
            'takeScreenshot' \
            "$SERVICE"

          grep -Fq \
            'TakeScreenshotCallback' \
            "$SERVICE"

          echo "Screenshot QR path: OK"

          # Pending claim / DANA guards
          grep -Fq \
            'id.dana' \
            "$SERVICE"

          grep -Fq \
            'hasPendingClaim' \
            "$SERVICE"

          grep -Fq \
            'awaitingClaimResult' \
            "$SERVICE"

          echo "DANA/pending-claim guards: OK"

          # Debug trace references
          grep -Fq \
            'DebugTrace.' \
            "$SERVICE"

          echo "Debug process trace references: OK"

          # --------------------------------------------------
          # BASIC JAVA DELIMITER VALIDATION
          # --------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "app/src/main/java/id/varino/danareceiver/"
              "DanaAutoClickAccessibilityService.java"
          )

          s = p.read_text(encoding="utf-8")

          pairs = {
              "{": "}",
              "(": ")",
              "[": "]",
          }

          closing = set(pairs.values())
          stack = []

          in_string = False
          in_char = False
          in_line_comment = False
          in_block_comment = False
          escape = False

          i = 0

          while i < len(s):

              c = s[i]
              n = s[i + 1] if i + 1 < len(s) else ""

              # Line comment
              if in_line_comment:
                  if c == "\n":
                      in_line_comment = False
                  i += 1
                  continue

              # Block comment
              if in_block_comment:
                  if c == "*" and n == "/":
                      in_block_comment = False
                      i += 2
                      continue

                  i += 1
                  continue

              # String
              if in_string:
                  if escape:
                      escape = False
                  elif c == "\\":
                      escape = True
                  elif c == '"':
                      in_string = False

                  i += 1
                  continue

              # Char
              if in_char:
                  if escape:
                      escape = False
                  elif c == "\\":
                      escape = True
                  elif c == "'":
                      in_char = False

                  i += 1
                  continue

              # Start comments
              if c == "/" and n == "/":
                  in_line_comment = True
                  i += 2
                  continue

              if c == "/" and n == "*":
                  in_block_comment = True
                  i += 2
                  continue

              # Start string
              if c == '"':
                  in_string = True
                  i += 1
                  continue

              # Start char
              if c == "'":
                  in_char = True
                  i += 1
                  continue

              # Opening delimiters
              if c in pairs:
                  stack.append(pairs[c])

              # Closing delimiters
              elif c in closing:

                  if not stack or stack.pop() != c:
                      raise SystemExit(
                          f"Java delimiter mismatch "
                          f"at character {i}: {c}"
                      )

              i += 1

          if in_string:
              raise SystemExit("Java string left open")

          if in_char:
              raise SystemExit("Java char literal left open")

          if in_block_comment:
              raise SystemExit("Java block comment left open")

          if stack:
              raise SystemExit(
                  f"Java delimiters left open: {stack[-10:]}"
              )

          print("Java delimiter check: OK")
          PY

          echo "=================================================="
          echo "V17 DEBUG TRACE SOURCE VALIDATION OK"
          echo "=================================================="

      - name: Configure Android SDK
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"

          cd "$PROJECT_DIR"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK tidak ditemukan."
            exit 1
          fi

          echo "sdk.dir=$SDK_ROOT" > local.properties

          echo "ANDROID SDK:"
          echo "$SDK_ROOT"

          SDKMANAGER=""

          if [ -x \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
          ]; then

            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          else

            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -perm -111 \
                2>/dev/null \
                | head -1 \
            )"

          fi

          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then

            yes | "$SDKMANAGER" --licenses \
              >/dev/null 2>&1 || true

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"

          else

            echo "WARNING: sdkmanager tidak ditemukan."
            echo "Melanjutkan menggunakan SDK yang tersedia."

          fi

          echo "Android SDK configuration: OK"

      - name: Setup Gradle
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"

          cd "$PROJECT_DIR"

          if [ -x "./gradlew" ]; then

            chmod +x ./gradlew

            echo "$PROJECT_DIR/gradlew" \
              > "$ROOT/.codemagic_gradle"

          elif command -v gradle >/dev/null 2>&1; then

            echo "$(command -v gradle)" \
              > "$ROOT/.codemagic_gradle"

          else

            VERSION="8.9"

            DIST_ROOT="$ROOT/.gradle-dist"

            GRADLE_HOME="$DIST_ROOT/gradle-$VERSION"

            GRADLE_ZIP="$DIST_ROOT/gradle-$VERSION-bin.zip"

            mkdir -p "$DIST_ROOT"

            if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then

              echo "Downloading Gradle $VERSION..."

              curl \
                --fail \
                --location \
                --retry 5 \
                --retry-all-errors \
                --connect-timeout 30 \
                --max-time 600 \
                -o "$GRADLE_ZIP" \
                "https://services.gradle.org/distributions/gradle-$VERSION-bin.zip"

              rm -rf "$GRADLE_HOME"

              unzip -q \
                "$GRADLE_ZIP" \
                -d "$DIST_ROOT"

            fi

            echo "$GRADLE_HOME/bin/gradle" \
              > "$ROOT/.codemagic_gradle"

          fi

          GRADLE="$(cat "$ROOT/.codemagic_gradle")"

          chmod +x "$GRADLE" 2>/dev/null || true

          echo "Using Gradle:"
          "$GRADLE" --version

      - name: Build V17 DEBUG TRACE APK
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"

          PROJECT_DIR="$(
            cat "$ROOT/.codemagic_project_dir"
          )"

          GRADLE="$(
            cat "$ROOT/.codemagic_gradle"
          )"

          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "BUILD DANA NATIVE RECEIVER V17"
          echo "DEBUG PROCESS TRACE"
          echo "=================================================="

          "$GRADLE" \
            clean \
            assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain

      - name: Verify and export V17 DEBUG TRACE APK
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"

          PROJECT_DIR="$(
            cat "$ROOT/.codemagic_project_dir"
          )"

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          OUTPUT="$CM_EXPORT_DIR/DanaNativeReceiver-V17-DEBUG-TRACE-ADAPTIVE-LOADING-4TAP-QR.apk"

          if [ ! -f "$APK" ]; then

            echo "ERROR: APK tidak ditemukan setelah build."

            echo "Searching APK files..."

            find "$PROJECT_DIR" \
              -type f \
              -name '*.apk' \
              -print || true

            exit 1
          fi

          mkdir -p "$CM_EXPORT_DIR"

          cp "$APK" "$OUTPUT"

          echo "=================================================="
          echo "V17 DEBUG TRACE APK EXPORT OK"
          echo "=================================================="

          ls -lh "$OUTPUT"

          echo ""
          echo "SHA-256:"

          if command -v shasum >/dev/null 2>&1; then

            shasum -a 256 "$OUTPUT"

          elif command -v sha256sum >/dev/null 2>&1; then

            sha256sum "$OUTPUT"

          fi

          echo ""
          echo "APK READY."

    artifacts:
      - $CM_EXPORT_DIR/DanaNativeReceiver-V17-DEBUG-TRACE-ADAPTIVE-LOADING-4TAP-QR.apk
