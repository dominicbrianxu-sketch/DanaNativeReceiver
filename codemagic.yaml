workflows:
  dana-native-receiver-v11:
    name: DanaNativeReceiver V11 - AUTO TAP + QR DANA Kaget
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:

      - name: Prepare Android project
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          cd "$ROOT"

          echo "========================================"
          echo " REPOSITORY"
          echo "========================================"

          ls -lah

          # Jika project Android sudah langsung berada di root
          if [ -f "$ROOT/settings.gradle" ] || [ -f "$ROOT/settings.gradle.kts" ]; then

            PROJECT_DIR="$ROOT"

          else

            echo "Project Android belum berada di root."
            echo "Mencari ZIP project..."

            ZIP_FILE=""

            for f in "$ROOT"/*.zip; do
              if [ -f "$f" ]; then
                ZIP_FILE="$f"
                break
              fi
            done

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: ZIP project Android tidak ditemukan."
              exit 1
            fi

            EXTRACT_DIR="$ROOT/.android_project"

            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"

            echo "Extract:"
            echo "$ZIP_FILE"

            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            SETTINGS_FILE="$(
              find "$EXTRACT_DIR" \
                -type f \
                \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
                -print -quit
            )"

            if [ -z "$SETTINGS_FILE" ]; then

              echo "ERROR: settings.gradle tidak ditemukan setelah extract."

              echo "Struktur hasil extract:"
              find "$EXTRACT_DIR" -maxdepth 5 -print || true

              exit 1
            fi

            PROJECT_DIR="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"

          fi

          echo ""
          echo "========================================"
          echo " PROJECT DITEMUKAN"
          echo "========================================"

          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then

            echo "ERROR: settings.gradle tidak ditemukan."
            exit 1

          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then

            echo "ERROR: app/build.gradle tidak ditemukan."
            exit 1

          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then

            echo "ERROR: folder app tidak ditemukan."
            exit 1

          fi

          echo "$PROJECT_DIR" > "$ROOT/.codemagic_project_dir"

          echo ""
          echo "PROJECT VALID."

      - name: Validate V11 source
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"

          cd "$PROJECT_DIR"

          echo "========================================"
          echo " VALIDATE V11 SOURCE"
          echo "========================================"

          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/res/xml/dana_accessibility_service.xml

          SERVICE_FILE="$(
            find app/src/main \
              -type f \
              \( -name "*.java" -o -name "*.kt" \) \
              -print |
            xargs grep -l "AccessibilityService" 2>/dev/null |
            head -1 || true
          )"

          if [ -z "$SERVICE_FILE" ]; then

            echo "ERROR: AccessibilityService tidak ditemukan."
            exit 1

          fi

          echo "AccessibilityService:"
          echo "$SERVICE_FILE"

          echo ""
          echo "Checking ML Kit..."

          grep -Rqs \
            "com.google.mlkit:barcode-scanning" \
            app

          echo "ML Kit ditemukan."

          echo ""
          echo "Checking gesture capability..."

          grep -Rqs \
            "canPerformGestures" \
            app/src/main/res/xml

          echo "Gesture capability OK."

          echo ""
          echo "Checking screenshot capability..."

          grep -Rqs \
            "canTakeScreenshot" \
            app/src/main/res/xml

          echo "Screenshot capability OK."

          echo ""
          echo "Checking Uri import..."

          grep -Rqs \
            "import android.net.Uri;" \
            "$SERVICE_FILE"

          echo "Uri import OK."

          echo ""
          echo "========================================"
          echo " V11 SOURCE VALIDATION OK"
          echo "========================================"

      - name: Configure Android SDK
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"

          cd "$PROJECT_DIR"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then

            echo "ERROR: Android SDK tidak ditemukan."
            exit 1

          fi

          echo "Android SDK:"
          echo "$SDK_ROOT"

          echo "sdk.dir=$SDK_ROOT" > local.properties

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then

            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          else

            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -perm -111 \
                2>/dev/null |
              head -1 || true
            )"

          fi

          if [ -n "$SDKMANAGER" ] &&
             [ -x "$SDKMANAGER" ]; then

            echo "sdkmanager ditemukan."

            yes | "$SDKMANAGER" \
              --licenses \
              >/dev/null 2>&1 || true

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              || true

          else

            echo "sdkmanager tidak ditemukan."
            echo "Menggunakan SDK Codemagic yang tersedia."

          fi

      - name: Setup Gradle
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"

          cd "$PROJECT_DIR"

          echo "========================================"
          echo " SETUP GRADLE"
          echo "========================================"

          if [ -x "./gradlew" ]; then

            echo "Gradle wrapper ditemukan."

            chmod +x ./gradlew

            echo "./gradlew" > "$ROOT/.codemagic_gradle"

          else

            echo "Gradle wrapper tidak ditemukan."
            echo "Menggunakan Gradle 8.9."

            VERSION="8.9"

            GRADLE_DIR="$ROOT/.gradle-dist/gradle-$VERSION"

            GRADLE_ZIP="$ROOT/.gradle-dist/gradle-$VERSION-bin.zip"

            mkdir -p "$ROOT/.gradle-dist"

            if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then

              curl \
                --fail \
                --location \
                --retry 5 \
                --retry-all-errors \
                --connect-timeout 30 \
                --max-time 600 \
                -o "$GRADLE_ZIP" \
                "https://services.gradle.org/distributions/gradle-$VERSION-bin.zip"

              rm -rf "$GRADLE_DIR"

              unzip -q \
                "$GRADLE_ZIP" \
                -d "$ROOT/.gradle-dist"

            fi

            echo "$GRADLE_DIR/bin/gradle" \
              > "$ROOT/.codemagic_gradle"

          fi

          GRADLE="$(cat "$ROOT/.codemagic_gradle")"

          chmod +x "$GRADLE" 2>/dev/null || true

          echo ""
          echo "Gradle version:"

          "$GRADLE" --version

      - name: Build V11 APK
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"

          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"

          GRADLE="$(cat "$ROOT/.codemagic_gradle")"

          cd "$PROJECT_DIR"

          echo "========================================"
          echo " BUILD DANA NATIVE RECEIVER V11"
          echo "========================================"

          echo ""
          echo "Project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Running Gradle..."

          "$GRADLE" \
            clean \
            assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain

          echo ""
          echo "Gradle build selesai."

      - name: Verify APK
        script: |
          set -e

          ROOT="$CM_BUILD_DIR"

          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          echo "========================================"
          echo " VERIFY APK"
          echo "========================================"

          if [ ! -f "$APK" ]; then

            echo "ERROR: APK tidak ditemukan."

            echo ""
            echo "Mencari APK yang tersedia:"

            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1

          fi

          echo ""
          echo "APK ditemukan:"

          echo "$APK"

          ls -lh "$APK"

          mkdir -p "$CM_EXPORT_DIR"

          cp \
            "$APK" \
            "$CM_EXPORT_DIR/DanaNativeReceiver-V11-AUTO-TAP-QR.apk"

          echo ""
          echo "========================================"
          echo " BUILD SUCCESS"
          echo "========================================"

          ls -lh \
            "$CM_EXPORT_DIR/DanaNativeReceiver-V11-AUTO-TAP-QR.apk"

    artifacts:
      - $CM_EXPORT_DIR/DanaNativeReceiver-V11-AUTO-TAP-QR.apk
