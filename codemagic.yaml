workflows:
  dana-native-receiver-v30:
    name: DanaNativeReceiver V30 - Notification Auto Open + 10 Tap + QR + Cache
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Locate V30 Android project
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          cd "$ROOT"

          echo "=================================================="
          echo "DANA NATIVE RECEIVER V30"
          echo "NOTIFICATION AUTO OPEN + TAP FIXED"
          echo "=================================================="

          PROJECT_DIR=""

          if [ -f "$ROOT/settings.gradle" ] || [ -f "$ROOT/settings.gradle.kts" ]; then
            PROJECT_DIR="$ROOT"
          else
            ZIP_FILE=""

            for pattern in \
              "$ROOT"/DanaNativeReceiver_V30*.zip \
              "$ROOT"/DanaNativeReceiver*.zip \
              "$ROOT"/*.zip; do
              if [ -f "$pattern" ]; then
                ZIP_FILE="$pattern"
                break
              fi
            done

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: ZIP/project DanaNativeReceiver tidak ditemukan."
              find "$ROOT" -maxdepth 3 -type f -print || true
              exit 1
            fi

            EXTRACT_DIR="$ROOT/.android_project"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"

            echo "Extract: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            SETTINGS_FILE="$(find "$EXTRACT_DIR" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle/settings.gradle.kts tidak ditemukan."
              find "$EXTRACT_DIR" -maxdepth 6 -type f -print || true
              exit 1
            fi

            PROJECT_DIR="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"
          fi

          test -f "$PROJECT_DIR/settings.gradle" || test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "$PROJECT_DIR" > "$ROOT/.codemagic_project_dir"

          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Verify V30 notification auto-open and TAP source
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          cd "$PROJECT_DIR"

          SERVICE="$(find app/src/main/java -type f -name 'DanaAutoClickAccessibilityService.java' -print -quit)"
          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ -z "$SERVICE" ]; then
            echo "ERROR: DanaAutoClickAccessibilityService.java tidak ditemukan."
            exit 1
          fi

          test -f "$MANIFEST"

          echo "Service: $SERVICE"

          # Notification URL detection must exist.
          grep -Fq 'link.dana.id' "$SERVICE"
          grep -Fq 'DANA_NOTIFICATION_URL_PATTERN' "$SERVICE"
          grep -Fq 'handleDanaNotificationUrl' "$SERVICE"
          grep -Fq 'openDanaFromNotification' "$SERVICE"

          # Native DANA package must be targeted.
          grep -Fq 'id.dana' "$SERVICE"

          # Direct TAP sequence must exist and retain 10 attempts.
          grep -Fq 'scheduleDirectEnvelopeTap' "$SERVICE"
          grep -Fq 'startDirectTapSequence' "$SERVICE"
          grep -Fq 'dispatchNextDirectTap' "$SERVICE"
          grep -Fq 'DIRECT_TAP_MAX_ATTEMPTS = 10' "$SERVICE"

          # Learned TAP coordinates must remain enabled.
          grep -Fq 'saveLearnedTapPoint' "$SERVICE"
          grep -Fq 'learned_envelope_x' "$SERVICE"
          grep -Fq 'learned_envelope_y' "$SERVICE"

          # Claim/result state must remain.
          grep -Fq 'hasPendingClaim' "$SERVICE"
          grep -Fq 'awaitingClaimResult' "$SERVICE"

          # QR path must remain.
          grep -Fq 'takeScreenshot' "$SERVICE"
          grep -Fq 'Barcode.FORMAT_QR_CODE' "$SERVICE"

          # Accessibility gesture support.
          grep -Fq 'dispatchGesture' "$SERVICE"

          # DANA AccessibilityService registration.
          grep -Fq 'DanaAutoClickAccessibilityService' "$MANIFEST"
          grep -Fq 'android.permission.BIND_ACCESSIBILITY_SERVICE' "$MANIFEST"

          echo "=================================================="
          echo "V30 SOURCE CHECK PASSED"
          echo "Notification -> DANA + 10 TAP + learned TAP + QR"
          echo "=================================================="

      - name: Verify callback context and Java structure
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          def strip_non_code(text):
              out = list(text)
              state = "code"
              escape = False
              i = 0

              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if state == "line":
                      out[i] = " "
                      if c == "\n":
                          state = "code"

                  elif state == "block":
                      out[i] = " "
                      if c == "*" and n == "/":
                          out[i + 1] = " "
                          i += 1
                          state = "code"

                  elif state == "string":
                      out[i] = " "
                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == '"':
                          state = "code"

                  elif state == "char":
                      out[i] = " "
                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == "'":
                          state = "code"

                  else:
                      if c == "/" and n == "/":
                          out[i] = out[i + 1] = " "
                          i += 1
                          state = "line"
                      elif c == "/" and n == "*":
                          out[i] = out[i + 1] = " "
                          i += 1
                          state = "block"
                      elif c == '"':
                          out[i] = " "
                          state = "string"
                      elif c == "'":
                          out[i] = " "
                          state = "char"

                  i += 1

              return "".join(out)

          def check_java(path):
              text = path.read_text(encoding="utf-8")
              clean = strip_non_code(text)

              stack = []
              pairs = {"{": "}", "(": ")", "[": "]"}
              closers = set(pairs.values())

              for pos, ch in enumerate(clean):
                  if ch in pairs:
                      stack.append(pairs[ch])
                  elif ch in closers:
                      if not stack or stack.pop() != ch:
                          raise SystemExit(
                              f"Java delimiter mismatch: {path}:{pos}"
                          )

              if stack:
                  raise SystemExit(
                      f"Java delimiter unclosed: {path}: {stack[-10:]}"
                  )

          for p in Path("app/src/main/java").rglob("*.java"):
              check_java(p)

          service = next(
              Path("app/src/main/java").rglob(
                  "DanaAutoClickAccessibilityService.java"
              )
          )

          text = service.read_text(encoding="utf-8")

          callback_blocks = re.findall(
              r"new\s+(GestureResultCallback|TakeScreenshotCallback)\s*\(\s*\)\s*\{",
              text
          )

          if not callback_blocks:
              raise SystemExit(
                  "ERROR: callback TAP/screenshot tidak ditemukan."
              )

          # Avoid the classic Java anonymous-callback mistake:
          # DebugTrace(... this, ...) where `this` means the callback object.
          if re.search(
              r"new\s+(GestureResultCallback|TakeScreenshotCallback).*?"
              r"DebugTrace\.[A-Za-z_]+\(\s*this\s*,",
              text,
              re.S
          ):
              raise SystemExit(
                  "ERROR: DebugTrace callback masih menggunakan `this` "
                  "dari anonymous callback."
              )

          print("Java structure: OK")
          print(f"Gesture/screenshot callback blocks: {len(callback_blocks)}")
          PY

      - name: Verify XML resources
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for p in Path("app/src/main").rglob("*.xml"):
              ET.parse(p)
              print(f"XML OK: {p}")
          PY

      - name: Configure Android SDK 35
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          cd "$PROJECT_DIR"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: ANDROID_SDK_ROOT/ANDROID_HOME tidak tersedia."
            exit 1
          fi

          echo "sdk.dir=$SDK_ROOT" > local.properties

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -perm -111 \
                -print \
                -quit \
                2>/dev/null || true
            )"
          fi

          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0" || true
          fi

          test -d "$SDK_ROOT/platforms/android-35"

          echo "Android SDK 35: OK"

      - name: Prepare Gradle
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          cd "$PROJECT_DIR"

          if [ -x "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD="$PROJECT_DIR/gradlew"

          elif command -v gradle >/dev/null 2>&1; then
            GRADLE_CMD="$(command -v gradle)"

          else
            GRADLE_VERSION="8.14.1"
            DIST="$ROOT/.gradle-dist"
            HOME_DIR="$DIST/gradle-$GRADLE_VERSION"
            ZIP="$DIST/gradle-$GRADLE_VERSION-bin.zip"

            mkdir -p "$DIST"

            if [ ! -x "$HOME_DIR/bin/gradle" ]; then
              curl \
                --fail \
                --location \
                --retry 5 \
                --retry-all-errors \
                --connect-timeout 30 \
                --max-time 600 \
                -o "$ZIP" \
                "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"

              rm -rf "$HOME_DIR"
              unzip -q "$ZIP" -d "$DIST"
            fi

            GRADLE_CMD="$HOME_DIR/bin/gradle"
          fi

          test -x "$GRADLE_CMD"

          echo "$GRADLE_CMD" > "$ROOT/.codemagic_gradle"

          "$GRADLE_CMD" --version

      - name: Build V30 Debug APK
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"
          GRADLE="$(cat "$ROOT/.codemagic_gradle")"

          cd "$PROJECT_DIR"

          echo "=================================================="
          echo "BUILD DANA NATIVE RECEIVER V30"
          echo "=================================================="

          "$GRADLE" \
            --no-daemon \
            --stacktrace \
            --console=plain \
            clean \
            assembleDebug

      - name: Verify APK
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          PROJECT_DIR="$(cat "$ROOT/.codemagic_project_dir")"

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find "$PROJECT_DIR" -type f -name "*.apk" -print || true
            exit 1
          fi

          mkdir -p "$ROOT/out"

          cp "$APK" \
            "$ROOT/out/DanaNativeReceiver-V30-NOTIFICATION-AUTOOPEN-TAP-FIXED.apk"

          echo "APK berhasil dibuat:"
          ls -lh "$ROOT/out/DanaNativeReceiver-V30-NOTIFICATION-AUTOOPEN-TAP-FIXED.apk"

          echo "SHA256:"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 \
              "$ROOT/out/DanaNativeReceiver-V30-NOTIFICATION-AUTOOPEN-TAP-FIXED.apk"
          else
            sha256sum \
              "$ROOT/out/DanaNativeReceiver-V30-NOTIFICATION-AUTOOPEN-TAP-FIXED.apk"
          fi

    artifacts:
      - $CM_BUILD_DIR/out/DanaNativeReceiver-V30-NOTIFICATION-AUTOOPEN-TAP-FIXED.apk
