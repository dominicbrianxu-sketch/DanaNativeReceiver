workflows:
  dana-native-receiver-v11:
    name: DanaNativeReceiver V11 - AUTO TAP + QR DANA Kaget
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Validate project structure
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/xml/dana_accessibility_service.xml
          test -f app/src/main/java/id/varino/danareceiver/DanaAutoClickAccessibilityService.java
          test -f app/src/main/java/id/varino/danareceiver/MainActivity.java
          test -f app/src/main/java/id/varino/danareceiver/NtfyService.java
          test -f app/src/main/java/id/varino/danareceiver/BootReceiver.java

          grep -q "com.google.mlkit:barcode-scanning:17.3.0" app/build.gradle
          grep -q 'android:canTakeScreenshot="true"' app/src/main/res/xml/dana_accessibility_service.xml
          grep -q 'android:canPerformGestures="true"' app/src/main/res/xml/dana_accessibility_service.xml

          echo "Project V11 validation OK."

      - name: Configure Android SDK
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          : "${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT is not set by Codemagic}"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -1 || true)"
          fi

          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan di Android SDK."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          GRADLE_VERSION="8.9"
          GRADLE_DIR="$CM_BUILD_DIR/.gradle-dist/gradle-$GRADLE_VERSION"
          GRADLE_ZIP="$CM_BUILD_DIR/.gradle-dist/gradle-$GRADLE_VERSION-bin.zip"

          mkdir -p "$CM_BUILD_DIR/.gradle-dist"

          if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then
            curl --fail --location --retry 3 --retry-all-errors \
              -o "$GRADLE_ZIP" \
              "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"

            rm -rf "$GRADLE_DIR"

            unzip -q "$GRADLE_ZIP" \
              -d "$CM_BUILD_DIR/.gradle-dist"
          fi

          "$GRADLE_DIR/bin/gradle" --version

      - name: Build debug APK
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          GRADLE="$CM_BUILD_DIR/.gradle-dist/gradle-8.9/bin/gradle"

          "$GRADLE" clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK artifact
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          APK_PATH="$CM_BUILD_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK_PATH"

          mkdir -p "$CM_EXPORT_DIR"

          cp "$APK_PATH" \
            "$CM_EXPORT_DIR/DanaNativeReceiver-V11-AUTO-TAP-QR.apk"

          ls -lh \
            "$CM_EXPORT_DIR/DanaNativeReceiver-V11-AUTO-TAP-QR.apk"

    artifacts:
      - $CM_EXPORT_DIR/DanaNativeReceiver-V11-AUTO-TAP-QR.apk
